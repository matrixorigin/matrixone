services:
  cn-0:
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        cp /config/cn-0.toml /tmp/cn-0-arrow-bvt.toml
        printf '%s\n' \
          '' \
          '[cn.frontend.arrow-load]' \
          'enabled = true' \
          's3-enabled = true' \
          'distributed-enabled = true' >> /tmp/cn-0-arrow-bvt.toml
        exec /mo-service -debug-http :12345 -cfg /tmp/cn-0-arrow-bvt.toml > >(tee -a /log/cn-0.log) 2>&1

  cn-1:
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        cp /config/cn-1.toml /tmp/cn-1-arrow-bvt.toml
        printf '%s\n' \
          '' \
          '[cn.frontend.arrow-load]' \
          'enabled = true' \
          's3-enabled = true' \
          'distributed-enabled = true' >> /tmp/cn-1-arrow-bvt.toml
        exec /mo-service -debug-http :12345 -cfg /tmp/cn-1-arrow-bvt.toml > >(tee -a /log/cn-1.log) 2>&1
