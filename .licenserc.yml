header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Matrix Origin
  paths:
    - '**/*.go'
    - '**/*.c'
    - '**/*.s'
    - '**/*.h'
    - '**/*.cpp'
    - '**/*.proto'
  paths-ignore:
    - 'docs/'
    - 'test/'
    - 'optools/'
    - 'cgo/external/'
    - 'thirdparties/'
    # Sirius is an external Git submodule with its own source headers and license.
    - 'third_party/sirius/'
    - '.sca-go-module-cache/'
    - 'pkg/frontend/test/'
    - 'pkg/vm/engine/tae/mergesort/sort.go'
    - 'pkg/vm/engine/tae/mergesort/heap.go'
    - 'pkg/hakeeper/operator/'
    - '**/*.pb.go'
    - '**/.gitignore'
    - '**/goyacc.go'
    - 'pkg/sql/parsers/dialect/postgresql/postgresql_sql.go'
    - 'pkg/sql/parsers/dialect/mysql/mysql_sql.go'
    # Pinned Go 1.27.1 regexp implementation retains its BSD headers/license.
    - 'pkg/sql/plan/function/internal/regexp/regexp.go'
    - 'pkg/sql/plan/function/internal/regexp/exec.go'
    - 'pkg/sql/plan/function/internal/regexp/backtrack.go'
    - 'pkg/sql/plan/function/internal/regexp/onepass.go'
    # Vendored github.com/dlclark/regexp2 v1.10.0 fork (with the XuPeng-SH
    # fastclock patch) retains its MIT license; attribution is preserved in the
    # directory's LICENSE/ATTRIB/PROVENANCE files. MatrixOne-owned linemode*.go
    # files in the same directory carry the repository header instead.
    - 'pkg/sql/plan/function/internal/regexp2/fastclock.go'
    - 'pkg/sql/plan/function/internal/regexp2/fastclock_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/match.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_mono_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_options_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_pcre_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_performance_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_re2_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/regexp_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/replace.go'
    - 'pkg/sql/plan/function/internal/regexp2/replace_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/rtl_test.go'
    - 'pkg/sql/plan/function/internal/regexp2/runner.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/charclass.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/code.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/escape.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/fuzz.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/parser.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/prefix.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/replacerdata.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/tree.go'
    - 'pkg/sql/plan/function/internal/regexp2/syntax/writer.go'
    - 'pkg/common/fastrand/'
    - 'pkg/common/arenaskl/'
    - 'pkg/common/malloc/mimalloc/'
  comment: on-failure
dependency:
  files:
    - go.mod
  licenses:
    - name: github.com/mattn/go-localereader
      license: MIT
    # The generated Go submodule carries Apache-2.0 SPDX headers but omits
    # the repository-level LICENSE file from its module zip.
    - name: github.com/substrait-io/substrait-protobuf/go
      license: Apache-2.0
