syntax = "proto3";
package logtail;

import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "timestamp.proto";
import "api.proto";

option go_package = "github.com/matrixorigin/matrixone/pkg/pb/logtail";
option (gogoproto.sizer_all)      = false;
option (gogoproto.protosizer_all) = true;

// SubscribeRequest is the request for subscription.
message SubscribeRequest {
    api.TableID table = 1;
}

// UnsubscribeRequest is the request for unsubscription.
message UnsubscribeRequest {
    api.TableID table = 1;
}

// ReadBarrierRequest asks the TN logtail publisher for a linearizable
// publication frontier. barrier_id is scoped to one stream and correlates the
// asynchronous response with its caller.
message ReadBarrierRequest {
    uint64 barrier_id = 1;
    // If set, request a conservative target for this table's contents and
    // catalog identity rather than a published FIFO frontier. Send only to a
    // peer that advertises supports_table_read_target.
    api.TableID table_read_target = 2;
}

// TableLogtail describes total or additional logtail for a table.
message TableLogtail {
    string ckp_location         = 1;
    timestamp.Timestamp ts      = 2;
    api.TableID table           = 3;
    repeated api.Entry commands = 4 [(gogoproto.nullable) = false];
}

// Status describes error details.
message Status {
    // error code from moerr package
    uint32 code = 1;

    // error message
    string message = 2;
}

// ErrorResponse is the response to notify CN with error.
message ErrorResponse {
    Status status     = 1 [(gogoproto.nullable) = false];
    api.TableID table = 2;
}

// SubscribeResponse is the response for subscription
//
// It contains total logtail for the newly subscribed table.
message SubscribeResponse {
    TableLogtail logtail = 1 [(gogoproto.nullable) = false];
    // The TN serving this stream advertises read-barrier support. Older TNs
    // omit the field; false or absent means there is no advertisement.
    bool supports_read_barrier = 2;
    bool supports_table_read_target = 3;
}

// UpdateResponse is the response for additional logtail
//
// It contains additional logtail for all subscribed tables.
// The range of duration is (From, to].
message UpdateResponse {
    timestamp.Timestamp From           = 1;
    timestamp.Timestamp To             = 2;
    repeated TableLogtail logtail_list = 3 [(gogoproto.nullable) = false];
}

// UnSubscribeResponse is the response for unsubscription
message UnSubscribeResponse {
    api.TableID table = 1;
}

// For a FIFO barrier, the response follows all earlier logtail events on the
// stream. A table-read target may arrive before the corresponding logtail; it
// is never itself applied progress. In both cases the CN must await actual
// application of the returned timestamp.
message ReadBarrierResponse {
    uint64 barrier_id              = 1;
    timestamp.Timestamp timestamp  = 2;
}

// logtail stream request
message LogtailRequest {
    uint64 request_id = 1;
    oneof request {
        SubscribeRequest subscribe_table     = 2;
        UnsubscribeRequest unsubscribe_table = 3;
        ReadBarrierRequest read_barrier       = 4;
    }
};

// logtail stream response
message LogtailResponse {
    uint64 response_id = 1;
    oneof response {
        SubscribeResponse subscribe_response     = 2;
        UnSubscribeResponse unsubscribe_response = 3;
        UpdateResponse update_response           = 4;
        ErrorResponse error                      = 5;
        ReadBarrierResponse read_barrier_response = 6;
    }
};

// message segment
message MessageSegment {
    uint64 StreamID   = 1;
    int32 MessageSize = 2;
    int32 Sequence    = 3;
    int32 MaxSequence = 4;
    bytes Payload     = 5;
}

service Logtail {
    rpc Logtail(stream LogtailRequest) returns (stream LogtailResponse) {}
}
