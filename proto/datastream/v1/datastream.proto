// DataStream is the wire contract between a MatrixOne datastream external
// table (ENGINE = datastream) and an external streaming data server such as
// xtool/jstfu.  This proto is shared with non-Go implementations (Java), so
// it uses standard proto3 and is generated with protoc-gen-go/protoc-gen-java,
// NOT gogoproto.

syntax = "proto3";

package datastream.v1;

option go_package = "github.com/matrixorigin/matrixone/pkg/datastream/v1;datastream";
option java_package = "io.matrixone.datastream.v1";
option java_multiple_files = true;
option java_outer_classname = "DataStreamProto";

service DataStream {
  // Read streams the content of one named datasource as CSV-encoded chunks.
  // Failures are delivered either as a gRPC status error or as a terminal
  // Error frame in the response stream (for errors discovered after
  // streaming has begun, e.g. a JDBC failure mid-scan).
  rpc Read(ReadRequest) returns (stream ReadResponse) {}
}

message ReadRequest {
  // Name of the datasource to read, as configured on the server.
  string table = 1;
  // Optional pushed-down predicate rendered as MySQL-dialect SQL text
  // ("" if none).  This is a HINT: the server should apply it as early as
  // possible but may ignore it entirely and return unfiltered rows.
  string filter = 2;
}

message ReadResponse {
  oneof payload {
    Chunk chunk = 1;
    // Terminal: the client aborts the scan and surfaces the error.
    Error error = 2;
  }
}

message Chunk {
  // CSV-encoded complete records:
  //   - fields terminated by ','
  //   - fields enclosed by '"' when they contain separators/quotes/newlines
  //   - records terminated by '\n'
  //   - NULL encoded as the unquoted 2-byte sequence \N
  // Every chunk contains only whole records: no record spans two chunks.
  bytes data = 1;
}

enum ErrorCode {
  ERROR_UNKNOWN = 0;
  // The requested table has no matching datasource on the server.
  ERROR_TABLE_NOT_FOUND = 1;
  // The datasource failed (JDBC error, file unreadable/unparsable, ...).
  ERROR_DATASOURCE_ERROR = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}
