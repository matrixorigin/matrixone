  enum MetadataScanInfoType {
    COL_NAME = 0;
    OBJECT_NAME = 1;
    IS_HIDDEN = 2;
    OBJ_LOC = 3;
    CREATE_TS = 4;
    DELETE_TS = 5;
    ROWS_CNT = 6;
    NULL_CNT = 7;
    COMPRESS_SIZE = 8;
    ORIGIN_SIZE = 9;
    MIN = 10;
    MAX = 11;
    SUM = 12;
    LEVEL = 13;
  }
  string col_name = 1;
  string object_name = 2;
  bool is_hidden = 3;
  bytes obj_loc = 4;
  bytes create_ts = 5;
  bytes delete_ts = 6;
  int64 row_cnt = 7;
  int64 null_cnt = 8;
  int64 compress_size = 9;
  int64 origin_size = 10;
  bytes zone_map = 11;
  int32 level = 12;
}

