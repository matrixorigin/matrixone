  bool if_not_exists = 1;
  string name = 2;
  int32 level = 3;
  string account_name = 4;
  string database_name = 5;
  string table_name = 6;
  int64 pitr_value = 7;
  string pitr_unit = 8;
  uint64 database_id = 9;
  uint64 table_id = 10;
  uint32 account_id = 11;
  uint32 current_account_id = 12;
  string current_account = 13;
  bool origin_account_name = 14;
}

