syntax = "proto3";
package plan;

import "github.com/gogo/protobuf/gogoproto/gogo.proto";
import "lock.proto";
import "timestamp.proto";

option go_package = "github.com/matrixorigin/matrixone/pkg/pb/plan";
option (gogoproto.protosizer_all) = true;
option (gogoproto.sizer_all) = false;
// Keep the generated message layout compatible with the checked-in bindings
// and preserve unknown fields when plans cross mixed-version nodes.
option (gogoproto.goproto_unrecognized_all) = true;
option (gogoproto.goproto_sizecache_all) = true;
option (gogoproto.goproto_unkeyed_all) = true;

message Type {
  int32 id = 1;
  bool notNullable = 2;
  bool auto_incr = 3;
  int32 width = 4;
  int32 scale = 5;
  string table = 6;
  string enumvalues = 7;
  uint32 charset = 8;
  // Internal semantic marker for VARCHAR/TEXT values that can carry
  // representation-only CHAR padding through a transparent query boundary.
  bool pad_space = 9;
}

message msgHeader {
  int32 msg_tag = 1;
  int32 msg_type = 2;
}

enum StringLiteralForm {
  STRING_LITERAL_NONE = 0;
  STRING_LITERAL_TEXT = 1;
  STRING_LITERAL_BINARY_INTRODUCER = 2;
  STRING_LITERAL_HEX = 3;
  STRING_LITERAL_BIT = 4;
}

// Literal: if a literal value can be reprensented by int64 or
// double, use that, otherwise store a string representation.
message Literal {
  bool isnull = 1;
  oneof value {
    int32 i8val = 2; // pb have no int8
    int32 i16val = 3; // pb have no int16
    int32 i32val = 4;
    int64 i64val = 5;
    uint32 u8val = 6; // pb have no uint8
    uint32 u16val = 7; // pb have no uint16
    uint32 u32val = 8;
    uint64 u64val = 9;
    double dval = 10;
    string sval = 11;
    bool bval = 12;
    float fval = 13;
    int32 dateval = 14;
    int64 timeval = 15;
    int64 datetimeval = 16;
    decimal64 decimal64val = 17;
    decimal128 decimal128val = 18;
    int64 timestampval = 19;
    string jsonval = 20;
    bool defaultval = 21;
    bool updateVal = 22;
    uint32 enumVal = 23; // pb have no uint32
    string vecVal = 24;
  }
  bool isBin = 25;
  Expr src = 26; // if generated by replacing an existing expr
  // serial and serial_full store tuple-encoded bytes in a varchar literal.
  // Keep that diagnostic provenance separate from isBin, which has execution
  // semantics for SQL hex and bit literals.
  bool is_serialized = 27;
  // literal_form records binder-visible syntax independently from isBin and
  // the resolved SQL string domain. Zero keeps old serialized plans valid.
  StringLiteralForm literal_form = 28;
  // Executable value ownership encoded as container/types.StringSource + 1.
  // Zero means an ordinary source literal for compatibility with old plans.
  uint32 string_source = 29;
}

// Bounded param for prepared statement.  User fill on execution.
message ParamRef {
  int32 pos = 1;
}

// Session variable ref, compiler should fold.
message VarRef {
  string name = 1;
  bool system = 2;
  bool global = 3;
}

// Reference a column in the proj list of a node.
message ColRef {
  int32 rel_pos = 1;
  int32 col_pos = 2;
  string name = 3;
  string tbl_name = 4;
  string db_name = 5;
}

// Reference a column by its internal table id and column id
message RawColRef {
  uint64 tbl_id = 1;
  uint64 col_id = 2;
}

// Reference a correlated column in the proj list of a node.
message CorrColRef {
  int32 rel_pos = 1;
  int32 col_pos = 2;
  int32 depth = 3;
}

// ExprList is a type of Expr
message ExprList {
  repeated Expr list = 1;
}

message MaxValue {
  string value = 1;
}

// TargetType used in cast function as target type
message TargetType {}

// Reference a subquery
message SubqueryRef {
  enum Type {
    SCALAR = 0;
    EXISTS = 1;
    NOT_EXISTS = 2;
    IN = 3;
    NOT_IN = 4;
    ANY = 5;
    ALL = 6;
  }

  Type typ = 1;
  int32 node_id = 2;
  string op = 3;
  Expr child = 4;
  int32 row_size = 5;
}

// Object ref, reference a object in database, 4 part name.
message ObjectRef {
  int64 server = 1;
  int64 db = 2;
  int64 schema = 3;
  int64 obj = 4;
  string server_name = 5;
  string db_name = 6;
  string schema_name = 7;
  string obj_name = 8;
  string subscription_name = 9;
  PubInfo pub_info = 10;
  bool not_lock_meta = 11;
  // snapshot preserves the catalog identity used to resolve this dependency.
  // Prepared statements must validate historical dependencies in the same
  // snapshot instead of resolving the current object.
  Snapshot snapshot = 12;
}

message PubInfo {
  int32 tenant_id = 1;
}

message SubscriptionMeta {
  string name = 1; // pubName
  int32 account_id = 2; // pubAccountID
  string db_name = 3; // pubDbName
  string account_name = 4; // pubAccountName
  string sub_name = 5; // subName(subscription side db name)
  string tables = 6; // pubTables (separated by ',')
}

message IndexScanInfo {
  bool is_index_scan = 1;
  string index_name = 2;
  string belong_to_table = 3;
  repeated string parts = 4;
  bool is_unique = 5;
  string index_table_name = 6;
}

enum AggregateConfigType {
  AGG_CONFIG_NONE = 0;
  AGG_CONFIG_GROUP_CONCAT_ORDER = 1;
}

message Function {
  // Function flags
  enum FuncFlag {
    NONE = 0;
    // Internal function is generated by system, cannot
    // by called by user.
    INTERNAL = 1;

    // Function, by default is immutable.
    STABLE = 2;
    VOLATILE = 4;

    // Nulls
    STRICT = 8;
    PRODUCE_NULL = 16;
    PRODUCE_NO_NULL = 32;

    // Vararg, all trailing args must be of the same type.
    VARARG = 64;

    // Window and Agg
    AGG = 128;
    WIN_VALUE = 256;
    WIN_ORDER = 512;

    // Filter which can be applied on zonemaps
    ZONEMAPPABLE = 1024;
  }

  ObjectRef func = 1;
  repeated Expr args = 2;
  bytes agg_config = 3;
  AggregateConfigType agg_config_type = 4;
  // Planner provenance only. Explicit CAST syntax can share the legacy CAST
  // overload while optimizers still distinguish it from an implicit cast.
  // Older CNs safely ignore this unknown field and execute the legacy overload.
  bool syntax_explicit_cast = 5;
}

// PreparedNumericMetadata is sparse planner provenance for a numeric overload
// that cannot be selected until COM_STMT_EXECUTE supplies a parameter type.
// It is kept behind one optional pointer on Expr because the metadata is rare;
// ordinary expressions must not carry five always-resident scalar fields.
message PreparedNumericMetadata {
  bool fallback = 1;
  int32 param_pos = 2;
  bool fallback_source = 3;
  int32 fallback_source_node_id = 4;
  int32 fallback_source_col_pos = 5;
  // Marks a result-arm cast introduced only because a prepared marker is TEXT
  // before SQL EXECUTE supplies its source domain. User-authored CAST never
  // carries this bit and remains an authoritative boundary.
  bool provisional_result_cast = 6;
  // Marks a result peer coerced into the marker's prepare-time TEXT envelope.
  bool provisional_result_peer = 7;
  int32 provisional_result_peer_type_id = 8;
  int32 provisional_result_peer_width = 9;
  int32 provisional_result_peer_scale = 10;
}

message Expr {
  Type typ = 1 [(gogoproto.nullable) = false];
  oneof expr {
    Literal lit = 2;
    ParamRef p = 3;
    VarRef v = 4;
    ColRef col = 5;
    RawColRef raw = 6;
    Function f = 7;
    WindowSpec w = 8;
    SubqueryRef sub = 9;
    CorrColRef corr = 10;
    TargetType t = 11;
    ExprList list = 12;
    MaxValue max = 13;
    LiteralVec vec = 14;
    FoldVal fold = 15;
  }

  int32 aux_id = 16;
  double ndv = 17;
  double selectivity = 18;
  // prepared_numeric is explicit planner metadata, not an executor memo
  // identity (AuxId), and therefore survives plan copies and RPC
  // serialization. A negative param_pos means there is no single source
  // marker. The source identity lets a flattened scalar-subquery consumer
  // refresh its ColRef type after the inner projection is rebound.
  PreparedNumericMetadata prepared_numeric = 19;
  reserved 20 to 23;
}

message FoldVal {
  int32 id = 1;
  bool is_const = 2;
  bytes data = 3;
}

message LiteralVec {
  int32 len = 1;
  bytes data = 2;
  // True when at least one element is a tuple-encoded serial value. This is
  // diagnostic provenance only; execution semantics remain in data.
  bool is_serialized = 3;
  // Uniform runtime value owner. Values follow container/types.StringSource;
  // zero is Expression so legacy and runtime-produced payloads stay ordinary.
  uint32 string_source = 4;
}

enum CompressType {
  None = 0;
  Lz4 = 1;
}

message decimal64 {
  int64 a = 1;
}

message decimal128 {
  int64 a = 1;
  int64 b = 2;
}

message ResultColDef {
  repeated ColDef ResultCols = 1;
}

message ColDef {
  uint64 col_id = 1;
  // letter case: lower
  string name = 2;
  bool hidden = 3;
  CompressType alg = 4;
  Type typ = 5 [(gogoproto.nullable) = false];
  bool not_null = 6;
  Default default = 7;
  string comment = 8;
  OnUpdate on_update = 9;
  bool low_card = 10;
  uint32 seqnum = 11;

  // XXX: Deprecated and to be removed soon.
  bool clusterBy = 12;
  bool primary = 13;
  int32 pkidx = 14;
  bool headers = 15;
  string header = 16;

  string tbl_name = 17;
  string db_name = 18;
  // get origin_name by ColDef.GetOriginCaseName(), letter case: origin
  string origin_name = 19;
  GeneratedCol generated_col = 20;
  // Whether the column is part of a unique key. This is also used by result
  // column metadata to populate the MySQL UNIQUE_KEY_FLAG.
  bool unique = 21;
  // Physical table name for result-column origin metadata. tbl_name is the
  // visible table name (and can therefore be an alias).
  string origin_tbl_name = 22;
}

message Default {
  Expr expr = 1;
  string origin_string = 2;

  // XXX: Deprecated and to be removed soon.
  bool null_ability = 3;
}

message OnUpdate {
  Expr expr = 1;
  string origin_string = 2;
}

message GeneratedCol {
  Expr expr = 1;
  string origin_string = 2;
  bool is_stored = 3;
}

message IndexOption {
  // Visibility carries DDL visibility independently of the legacy
  // IndexDef.visible proto3 bool. Existing constraints omitted that bool for
  // default-visible indexes, so its false value is ambiguous during upgrades.
  enum Visibility {
    VISIBILITY_UNSPECIFIED = 0;
    VISIBILITY_VISIBLE = 1;
    VISIBILITY_INVISIBLE = 2;
  }

  bool create_extra_table = 1;
  string parser_name = 2;
  int32 ngram_token_size = 3;
  Visibility visibility = 4;
}

message PrimaryKeyDef {
  // currently not used
  repeated uint64 cols = 1;
  // currently not used
  uint64 pkey_col_id = 2;
  // currently not used
  IndexOption option = 3;

  // Composed primary key column name: __mo_cpkey, letter case: lower
  string pkey_col_name = 4;
  // XXX: Deprecated and to be removed soon. letter case: lower
  repeated string names = 5;
  // Composite primary key column definition
  ColDef comp_pkey_col = 6;
}

message IndexDef {
  // Generate UUID for each index, currently not used
  string idx_id = 1;
  // letter case: lower
  string index_name = 2;
  // The constituent columns of the index, letter case: lower
  repeated string parts = 3;
  bool unique = 4;
  string index_table_name = 5;
  bool table_exist = 6;
  string comment = 7;
  bool visible = 8;
  IndexOption option = 9;
  string index_algo = 10;
  string index_algo_table_type = 11;
  string index_algo_params = 12;
  // Logical INCLUDE columns of the index, letter case: lower.
  repeated string included_columns = 13;
  // Reserved after removing optimizer visibility gating. Reusing the wire
  // identity would misinterpret plans produced by versions that carried it.
  reserved 14;
  reserved "visibility_set";
}

message ForeignKeyDef {
  enum RefAction {
    RESTRICT = 0;
    CASCADE = 1;
    SET_NULL = 2;
    SET_DEFAULT = 3;
    NO_ACTION = 4;
  }

  // Whether a reference action was written in the FK declaration.  This is
  // persisted separately from RefAction because an omitted action and an
  // explicit RESTRICT have the same execution behavior but distinct MySQL
  // metadata/SHOW CREATE representations.
  enum RefActionOrigin {
    ACTION_ORIGIN_EXPLICIT = 0;
    ACTION_ORIGIN_DEFAULT = 1;
    ACTION_ORIGIN_LEGACY_AMBIGUOUS = 2;
  }

  // letter case: lower
  string name = 1;
  repeated uint64 cols = 2;
  // Foreign key parent table Id
  uint64 foreign_tbl = 3;
  // Foreign key parent table dependent column colids
  repeated uint64 foreign_cols = 4;
  RefAction on_delete = 5;
  RefAction on_update = 6;
  // Exact PRIMARY/UNIQUE parent key selected when this FK was bound.
  string referenced_index_name = 7;
  RefActionOrigin on_delete_origin = 8;
  RefActionOrigin on_update_origin = 9;
}

message CheckDef {
  string name = 1;
  // Name for anonymous constraints, __mo_chk_[INDEX_ID]
  Expr check = 2;
  string origin_sql = 3;
}

message Partition {
  repeated PartitionDef PartitionDefs = 1;
}

message PartitionDef {
  Expr def = 1;
}

message ClusterByDef {
  // XXX: Deprecated and to be removed soon. letter case: lower ?
  string name = 1;
  // Composite cluster by column definition
  ColDef comp_cbkey_col = 2;
}

message PropertyDef {
  string key = 1;
  string value = 2;
}

message Property {
  string key = 1;
  string value = 2;
}

message PropertiesDef {
  repeated Property properties = 1;
}

message ViewDef {
  string view = 1;
}

message TableDef {
  // XXX: Deprecated and to be removed soon.
  message DefType {
    oneof def {
      PropertiesDef properties = 1;
    }
  }

  uint64 tbl_id = 1;
  string name = 2;
  bool hidden = 3;
  repeated ColDef cols = 4;
  string table_type = 5;
  string createsql = 6;
  TableFunction tbl_func = 7;
  uint32 version = 8;

  PrimaryKeyDef pkey = 11;
  repeated IndexDef indexes = 12;
  repeated ForeignKeyDef fkeys = 13;
  repeated uint64 ref_child_tbls = 14;
  repeated CheckDef checks = 15;

  ClusterByDef cluster_by = 22;
  repeated PropertyDef props = 23;
  ViewDef view_sql = 24;

  // XXX: Deprecated and to be removed soon.
  repeated DefType defs = 25;
  // letter case: lower
  map<string, int32> name2col_index = 26;
  bool isLocked = 27;
  TableLockType tableLockType = 28;
  bool is_temporary = 29;

  uint64 auto_incr_offset = 30;
  bool is_dynamic = 31;

  string db_name = 32;
  uint64 db_id = 33;

  Partition partition = 34;

  uint64 FeatureFlag = 35;
  uint64 logical_id = 36;
  string original_name = 37;
  // Persistent cache epoch for AUTO_INCREMENT allocation.
  uint32 auto_incr_epoch = 38;
  // Default collation class inherited by textual columns without an explicit
  // column-level collation. Uses the container/types Charset constants.
  uint32 default_charset = 39;
}

message TableFunction {
  string name = 1;
  bytes param = 2;
  bool is_single = 3;
  // Planner-resolved references for an internal FULLTEXT scan over a
  // subscription. SQL arguments remain user-visible data and must never carry
  // the publisher execution identity.
  ObjectRef fulltext_source_ref = 4;
  ObjectRef fulltext_index_ref = 5;
}

enum ShuffleType {
  Hash = 0;
  Range = 1;
}

enum ShuffleMethod {
  Normal = 0;
  Reuse = 1;
}

enum ShuffleTypeForMultiCN {
  Simple = 0;
  Hybrid = 1;
}

message HashMapStats {
  // hashmap size for nodes which build a hashmap
  double hashmap_size = 1;
  bool hashOnPK = 2;

  // for group by and join node with big hashmap, use shuffle
  // shuffle on which column. choose a column with max ndv
  bool shuffle = 3;
  int32 shuffleColIdx = 4;
  // shuffle type
  ShuffleType shuffleType = 5;
  ShuffleTypeForMultiCN shuffleTypeForMultiCN = 6;
  // for range shuffle on integer column, need to know its min and max value
  int64 shuffleColMin = 7;
  int64 shuffleColMax = 8;
  ShuffleMethod shuffleMethod = 9;
  int64 nullcnt = 10;
  repeated double ranges = 11;
}

message Stats {
  // for scan, number of blocks to read from S3
  int32 block_num = 1;
  // for scan, cost of reading from S3, basically the read lines
  // for other nodes, it means the estimated cost of current node
  double cost = 2;
  // number of output lines
  double outcnt = 3;
  // average size of one row
  double rowsize = 4;
  // for scan, this means total count of all table, before filtering
  double table_cnt = 5;
  // for scan, selectivity means outcnt divide total count
  double selectivity = 6;
  bool forceOneCN = 7;
  int32 dop = 8;
  HashMapStats hashmapStats = 9;
  string sql = 10;
}

message RowsetExpr {
  int32 row_pos = 1;
  Expr expr = 2;
}

message ColData {
  repeated RowsetExpr data = 1;
}

message RowsetData {
  repeated ColData cols = 1;
  int32 row_count = 2;
}

message OrderBySpec {
  enum OrderByFlag {
    INTERNAL = 0;
    ASC = 1;
    DESC = 2;
    NULLS_FIRST = 4;
    NULLS_LAST = 8;
    UNIQUE = 16;
  }

  Expr expr = 1;
  string collation = 2;
  OrderByFlag flag = 3;
}

message WindowSpec {
  Expr window_func = 1;
  repeated Expr partition_by = 2;
  repeated OrderBySpec order_by = 3;
  FrameClause frame = 4;
  string name = 5;
}

message SampleFuncSpec {
  int32 Rows = 1;
  double Percent = 2;
  bool UsingRow = 3;
}

message FrameClause {
  enum FrameType {
    ROWS = 0;
    RANGE = 1;
  }
  FrameType type = 1;
  FrameBound start = 2;
  FrameBound end = 3;
}

message FrameBound {
  enum BoundType {
    FOLLOWING = 0;
    PRECEDING = 1;
    CURRENT_ROW = 2;
  }
  BoundType type = 1;
  bool unBounded = 2;
  Expr val = 3;
}

// OnDuplicateKeyCtx removed: legacy ON DUPLICATE KEY operator path eliminated.
// ON DUPLICATE KEY UPDATE is now planned on the DEDUP JOIN + MULTI_UPDATE path.

message OldColCapture {
  // build_placeholder: position on the DEDUP JOIN build (right) side that
  // holds a NULL placeholder for the "old row" column. The operator will
  // emit the captured probe-side value into this slot in finalize().
  ColRef build_placeholder = 1 [(gogoproto.nullable) = false];
  // probe_source: position on the DEDUP JOIN probe (left) side. When a
  // build row matches a probe row via hashmap lookup, the value at this
  // column of the probe row is captured into a per-bucket buffer.
  ColRef probe_source = 2 [(gogoproto.nullable) = false];
}

message DedupJoinCtx {
  repeated ColRef old_col_list = 1 [(gogoproto.nullable) = false];
  repeated int32 update_col_idx_list = 2;
  repeated Expr update_col_expr_list = 3;
  // old_col_capture_list: used by REPLACE INTO's merged main-table scan.
  // When non-empty, the DEDUP JOIN captures probe-side columns on match
  // and emits them in finalize() into the build-side placeholder slots,
  // eliminating the need for a preceding LEFT JOIN to fetch old row data.
  repeated OldColCapture old_col_capture_list = 4 [(gogoproto.nullable) = false];
  // dedup_build_keep_last is set only by REPLACE INTO. It allows duplicate
  // keys on the DEDUP JOIN build side and keeps the last source row.
  bool dedup_build_keep_last = 5;
}

message UpdateCtx {
  ObjectRef obj_ref = 1;
  TableDef table_def = 2;

  repeated ColRef insert_cols = 7 [(gogoproto.nullable) = false];
  repeated ColRef delete_cols = 8 [(gogoproto.nullable) = false];
  repeated ColRef partition_cols = 9 [(gogoproto.nullable) = false];
  bool skip_insert_on_null_pk = 10;
  int32 insert_pk_col_idx = 11;
  bool count_delete_affect_rows = 12;
  bool ignore_affected_rows = 13;
  bool dedup_by_target_row_id = 14;
  int32 target_update_ctx_idx = 15;
  repeated ColRef affected_rows_cols = 16 [(gogoproto.nullable) = false];
  ColRef changed_rows_col = 17;
}

message InsertCtx {
  ObjectRef ref = 1;
  bool add_affected_rows = 2;
  bool is_cluster_table = 3;
  TableDef table_def = 4;
}

// ReplaceCtx removed: legacy REPLACE path eliminated.
// Keep field tag numbers reserved so they cannot be silently reused
// by a future re-introduction with a different schema (wire-compat).
message ReplaceCtx {
  reserved 1 to 9;
}

message AnalyzeInfo {
  int64 input_rows = 1;
  int64 output_rows = 2;
  int64 input_size = 3;
  int64 output_size = 4;
  int64 time_consumed = 5;
  int64 memory_size = 6;
  int64 wait_time_consumed = 7;
  int64 diskIO = 8;
  int64 scan_bytes = 9;
  int64 networkIO = 10;
  int64 scanTime = 11;
  int64 insertTime = 12;
  int64 wait_lock_time = 13;
  repeated int64 time_consumed_array_major = 14;
  repeated int64 time_consumed_array_minor = 15;
  int64 input_blocks = 16;
  int64 s3_list = 17;
  int64 s3_head = 18;
  int64 s3_put = 19;
  int64 s3_get = 20;
  int64 s3_delete = 21;
  int64 s3_delete_mul = 22;

  int64 cache_read = 23;
  int64 cache_hit = 24;
  int64 cache_memory_read = 25;
  int64 cache_memory_hit = 26;
  int64 cache_disk_read = 27;
  int64 cache_disk_hit = 28;
  int64 cache_remote_read = 29;
  int64 cache_remote_hit = 30;

  // written_rows used to estimate S3input
  int64 written_rows = 31;
  // deleted_rows used to estimate S3input
  int64 deleted_rows = 32;

  int64 memory_min = 33;
  int64 memory_max = 34;

  int64 spill_size = 35;
  int64 spill_rows = 36;
  int64 spill_min = 37;
  int64 spill_max = 38;

  // useful for detecting skews.
  int64 outrows_min = 39;
  int64 outrows_max = 40;

  // read_size: actual bytes read from storage layer (excluding rowid tombstone)
  int64 read_size = 41;
  // s3_read_size: actual bytes read from S3 (excluding rowid tombstone)
  int64 s3_read_size = 42;
  // disk_read_size: actual bytes read from disk cache (excluding rowid
  // tombstone)
  int64 disk_read_size = 43;
}

message OriginTableMessageForFuzzy {
  string ParentTableName = 1;
  repeated ColDef ParentUniqueCols = 2;
}

enum BoundType {
  UNBOUNDED = 0;
  INCLUSIVE = 1;
  EXCLUSIVE = 2;
}

message DistRange {
  BoundType lower_bound_type = 1;
  BoundType upper_bound_type = 2;
  Expr lower_bound = 3;
  Expr upper_bound = 4;
}

message IndexReaderParam {
  repeated OrderBySpec order_by = 1;
  Expr limit = 2;
  string orig_func_name = 3;
  DistRange dist_range = 4;
  int32 partition_cn_cnt = 5;
  int32 partition_cn_idx = 6;
  // EXPLAIN-only annotation: the plan-time over-fetched candidate budget for a
  // literal LIMIT (0 for a prepared LIMIT ?, whose over-fetch is computed at
  // EXECUTE). Execution never reads it; the TVF derives its budget from `limit`.
  uint64 over_fetch_limit = 7;
}

// VectorIndexTableRef identifies one hidden relation owned by a vector index.
// Role is the algorithm-declared hidden-table type (for example metadata,
// centroids, or entries).  Carrying resolved object/table metadata makes the
// access path self-contained on remote CNs without rebuilding SQL text.
message VectorIndexTableRef {
  string role = 1;
  ObjectRef object = 2;
  TableDef table = 3;
}

// VectorIndexScan is the optimizer-visible contract for an ANN access path.
// Algorithm mechanics (including adaptive IVF rounds) remain inside the
// plugin reader; query semantics stay typed and visible in the outer plan.
message VectorIndexScan {
  ObjectRef source_table = 1;
  TableDef source_table_def = 2;
  IndexDef index = 3;
  repeated VectorIndexTableRef hidden_tables = 4;
  Expr query_vector = 5;
  string distance_function = 6;
  OrderBySpec.OrderByFlag direction = 7;
  // Semantic result window k (including OFFSET compensation). Execution
  // derives a separate candidate budget when post_filter_over_fetch is set.
  Expr candidate_limit = 8;
  DistRange distance_range = 9;
  repeated Expr pre_filters = 10;
  repeated string included_columns = 11;
  uint32 initial_probe_count = 12;
  Expr first_round_limit = 13;
  uint32 bucket_expand_step = 14;
  int64 threads_search = 15;
  Snapshot scan_snapshot = 16;
  // The execution binder expands candidate_limit after prepared parameters are
  // available; readers receive both k and the bound candidate budget.
  bool post_filter_over_fetch = 17;
}

message Node {
  enum NodeType {
    UNKNOWN = 0;
    ASSERT = 100;

    // Scans
    VALUE_SCAN = 1;
    TABLE_SCAN = 2;
    FUNCTION_SCAN = 3;
    EXTERNAL_SCAN = 4;
    MATERIAL_SCAN = 5;
    reserved 6; // former SOURCE_SCAN
    reserved "SOURCE_SCAN";
    EXTERNAL_FUNCTION = 7;
    VECTOR_INDEX_SCAN = 8;

    // Proper Relational Operators
    PROJECT = 10;
    AGG = 11;
    DISTINCT = 12;
    FILTER = 13;
    JOIN = 14;
    SAMPLE = 15;
    SORT = 16;
    WINDOW = 17;
    UNION = 18;
    UNION_ALL = 19;
    UNIQUE = 20;
    INTERSECT = 21;
    INTERSECT_ALL = 22;
    MINUS = 23;
    MINUS_ALL = 24;

    // DML
    INSERT = 30;
    DELETE = 31;
    // REPLACE = 32; // removed: legacy REPLACE path eliminated
    reserved 32;
    LOCK_OP = 33;
    // ON_DUPLICATE_KEY = 34; // removed: legacy ON DUPLICATE KEY operator path eliminated
    reserved 34;
    PRE_INSERT = 35;

    FUZZY_FILTER = 37;
    // the node which build insert batch for hidden table(unique key)
    PRE_INSERT_UK = 38;
    PRE_INSERT_SK = 39;

    // Material, CTE, etc.
    MATERIAL = 40;
    RECURSIVE_CTE = 41;
    SINK = 42;
    SINK_SCAN = 43;
    RECURSIVE_SCAN = 44;
    BROADCAST = 45;
    SPLIT = 46;
    GATHER = 47;

    TIME_WINDOW = 50;
    FILL = 51;
    PARTITION = 52;
    APPLY = 53;
    MULTI_UPDATE = 54;
    POSTDML = 55;
    TABLE_CLONE = 56;
  }

  enum JoinType {
    INNER = 0;
    LEFT = 1;
    RIGHT = 2;
    OUTER = 3;
    SEMI = 4;
    ANTI = 5;
    SINGLE = 6;
    MARK = 7;
    INDEX = 8;
    L2 = 9;
    DEDUP = 10;
    ASOF = 11;
    ASOF_LEFT = 12;
  }

  enum AggMode {
    FULL = 0;
    BOTTOM = 1;
    TOP = 2;
  }

  enum FillType {
    NONE = 0;
    PREV = 1;
    NEXT = 2;
    NULL = 3;
    VALUE = 4;
    LINEAR = 5;
  }

  enum GapFillMode {
    GAP_FILL_NONE = 0;
    GAP_FILL_PARTITION = 1;
  }

  enum OnDuplicateAction {
    FAIL = 0;
    IGNORE = 1;
    UPDATE = 2;
  }

  enum ApplyType {
    CROSSAPPLY = 0;
    OUTERAPPLY = 1;
  }

  // FuzzyBuildSide is an explicit, planner-finalized execution decision.
  // UNSPECIFIED preserves legacy plans, whose compiler selects by cost.
  enum FuzzyBuildSide {
    FUZZY_BUILD_SIDE_UNSPECIFIED = 0;
    FUZZY_BUILD_SIDE_TABLE = 1;
    FUZZY_BUILD_SIDE_SINK = 2;
  }

  // Physical implementation for ordinary window PARTITION nodes. SORT is the
  // zero value so plans produced before this field existed retain the legacy
  // execution path.
  enum PartitionAlgorithm {
    PARTITION_ALGORITHM_SORT = 0;
    PARTITION_ALGORITHM_HASH = 1;
  }

  NodeType node_type = 1;
  int32 node_id = 2;
  Stats stats = 3;
  repeated int32 children = 4;

  // PROJECT
  repeated Expr project_list = 5;

  // JOIN
  JoinType join_type = 6;
  repeated Expr on_list = 7;
  bool is_right_join = 8;

  // FILTER
  repeated Expr filter_list = 9;

  // AGG
  repeated Expr group_by = 10;
  repeated bool grouping_flag = 11;
  repeated Expr agg_list = 12;

  // WINDOW
  repeated Expr win_spec_list = 13;

  // SORT
  repeated OrderBySpec order_by = 14;

  // LIMIT
  Expr limit = 15;
  Expr offset = 16;
  RankOption rank_option = 89;

  TableDef table_def = 17;
  ObjectRef obj_ref = 18;
  ObjectRef parent_obj_ref = 19;
  RowsetData rowset_data = 20;

  IndexScanInfo index_scan_info = 21 [(gogoproto.nullable) = false];

  string extra_options = 22;
  DeleteCtx delete_ctx = 23;

  repeated int32 binding_tags = 24;

  AnalyzeInfo analyze_info = 25;

  repeated Expr tbl_func_expr_list = 26;

  // used to connect two plans[steps]
  repeated int32 source_step = 27;

  ClusterTable cluster_table = 28;
  bool not_cacheable = 29;
  InsertCtx insert_ctx = 30;
  // ReplaceCtx replace_ctx = 31; // removed: legacy REPLACE path eliminated
  reserved 31;

  IndexReaderParam index_reader_param = 32;

  PreInsertCtx pre_insert_ctx = 34;
  // build unique key batch before insert into hidden table which keep the
  // unique key
  PreInsertUkCtx pre_insert_uk_ctx = 35;
  // OnDuplicateKeyCtx on_duplicate_key = 36; // removed: legacy ON DUPLICATE KEY operator path eliminated
  reserved 36;

  bool IsEnd = 37;
  repeated LockTarget lock_targets = 38;
  repeated Expr block_filter_list = 39;

  // Runtime filters
  repeated RuntimeFilterSpec runtime_filter_probe_list = 40;
  repeated RuntimeFilterSpec runtime_filter_build_list = 41;

  bytes uuid = 42;
  bool recursive_sink = 43;
  ExternScan extern_scan = 44;

  PreInsertUkCtx pre_insert_sk_ctx = 46;
  Expr interval = 47;
  Expr sliding = 48;
  Expr timestamp = 49;
  Expr wEnd = 50;

  FillType fill_type = 51;
  repeated Expr fill_val = 52;

  // sample function related.
  SampleFuncSpec sample_func = 53;

  int32 window_idx = 54;
  repeated Expr onUpdateExprs = 55;
  OriginTableMessageForFuzzy fuzzymessage = 56;
  bool ifInsertFromUnique = 57;

  // for message
  repeated msgHeader send_msg_list = 58 [(gogoproto.nullable) = false];
  repeated msgHeader recv_msg_list = 59 [(gogoproto.nullable) = false];

  DedupJoinCtx dedup_join_ctx = 60;

  repeated UpdateCtx update_ctx_list = 61;
  Snapshot scan_snapshot = 62;
  bool recursive_cte = 63;
  ApplyType apply_type = 64;
  PostDmlCtx post_dml_ctx = 65;

  OnDuplicateAction on_duplicate_action = 66;
  string dedup_col_name = 67;
  repeated Type dedup_col_types = 68 [(gogoproto.nullable) = false];
  bool rollup_filter = 69;

  // compile time performance setting
  int64 spill_mem = 70;
  repeated string origin_views = 71;
  string direct_view = 72;

  // TIME_WINDOW only: the GROUP BY columns other than the window's own
  // timestamp key. The operator restarts its window state whenever these
  // change, so each group gets its own windows instead of one global stream.
  repeated Expr time_window_partition_by = 73;

  // FILL only: positions of the partition keys inside this node's input batch
  // (the child TIME_WINDOW's projection). fill(prev/next/linear) must not
  // carry values across a partition boundary, so the operator compares these
  // columns to find where one group ends and the next begins.
  repeated int32 time_window_partition_col_pos = 74;

  // TIME_WINDOW only: explicitly generate missing buckets between each
  // partition's observed minimum and maximum timestamp.
  GapFillMode gap_fill_mode = 75;

  // RECURSIVE_CTE only: exclude rows already emitted by the anchor or an
  // earlier recursive iteration, implementing UNION / UNION DISTINCT fixpoint
  // semantics instead of UNION ALL bag semantics.
  bool recursive_union_distinct = 76;

  // FUZZY_FILTER only. Keeping this separate from runtime-filter metadata
  // makes build-side selection idempotent across repeated optimizer passes.
  FuzzyBuildSide fuzzy_build_side = 77;

  // AGG only: positions in group_by that form the physical hash/equality key.
  // An empty list preserves the legacy meaning that every group_by expression
  // participates in hashing. A non-empty list must be a strict subset proven
  // by the optimizer to determine all remaining group_by expressions.
  repeated int32 group_by_hash_key = 78;

  // FILTER only: evaluate this predicate at its current logical position.
  // Neither the filter itself nor predicates from its parent may cross this
  // node during pushdown. This is used when a predicate observes a final DML
  // row image and moving it would change statement semantics.
  bool filter_is_barrier = 79;

  // PARTITION only: when limit is set, order_by begins with this many
  // partition equality keys and the remaining entries are per-partition
  // ordering keys for bounded Top-N execution.
  int32 partition_by_count = 80;

  // TIME_WINDOW only: optional half-open GAPFILL domain inferred from simple
  // timestamp >= start and timestamp < finish predicates. Both expressions
  // must be present before the executor extends the observed data domain.
  Expr gap_fill_start = 81;
  Expr gap_fill_end = 82;

  // DEDUP only: the incoming key columns are proven unique by the insert
  // planner, so the right-side operator only needs to look up target keys and
  // must not retain incoming keys in its hashmap.
  bool dedup_input_keys_unique = 83;

  // JOIN only: the planner proved that the join is consumed by a scalar,
  // single COUNT(*) aggregate which understands a zero-column batch whose
  // row count carries the complete join multiplicity.
  bool emit_compressed_row_count = 84;

  // VECTOR_INDEX_SCAN only: typed vector-index access-path description.
  VectorIndexScan vector_index_scan = 85;

  // Physical equality expressions used by set operations and DISTINCT to
  // compare rows without changing the user-visible projected representation.
  // Empty preserves the legacy behavior of hashing every projected column.
  repeated Expr physical_equality_key_list = 87;

  // ASOF/ASOF_LEFT only: right input column used to choose the latest
  // qualifying predecessor after equality-key lookup.
  int32 asof_right_col = 86;

  // PARTITION only: optimizer-selected implementation for ordinary window
  // partitioning. Partition Top-N ignores this field.
  PartitionAlgorithm partition_algorithm = 90;
}

message SnapshotExtraInfo {
  string Level = 1;
  uint64 ObjId = 2;
  string Name = 3;
}

// Snapshot Represents a snapshot of the database
message Snapshot {
  // The timestamp of the snapshot
  timestamp.Timestamp TS = 1;
  // Tenant information for creating snapshots
  SnapshotTenant tenant = 2;

  SnapshotExtraInfo ExtraInfo = 3;
}

// Tenant information for creating snapshots
message SnapshotTenant {
  string tenantName = 1;
  uint32 tenantID = 2;
}

enum ExternType {
  LOAD = 0;
  EXTERNAL_TB = 1;
  RESULT_SCAN = 2;
  ICEBERG_TB = 3;
  MONGODB_TB = 4;
  DATASTREAM_TB = 5;
  FOREIGN_TB = 6;
  KAFKA_TB = 7;
}

message ExternScan {
  int32 type = 1;
  int32 load_type = 2;
  string data = 3;
  string format = 4;
  uint64 ignored_lines = 5;
  bytes enclosed_by = 6;
  string terminated = 7;
  string json_type = 8;
  bytes escaped_by = 9;
  map<string, int32> TbColToDataCol = 10;
  IcebergScan iceberg_scan = 11;
  MongoScan mongodb_scan = 12;
  DataStreamScan datastream_scan = 13;
  ForeignScan foreign_scan = 14;
  KafkaScan kafka_scan = 15;
}

// DataStreamScan describes a scan of a datastream external table: a
// streaming gRPC read of CSV chunks from server:port (see
// proto/datastream/v1/datastream.proto for the wire contract).
message DataStreamScan {
  string server = 1;
  int32 port = 2;
  string table = 3;
  bool recheck = 4;
  // pushed_filter is the deparsed SQL text of the filter conjuncts sent to
  // the server as a hint ("" when nothing could be pushed).
  string pushed_filter = 5;
  // api_key is the shared secret presented to the server ("" when the table
  // configured none).
  string api_key = 6;
}

// ForeignScan describes a scan of an ESQL/SQL foreign external table
// (CREATE EXTERNAL TABLE ... ENGINE = ESQL|SQL): the query texts to run come
// from __mo_query predicates (the scan's FileList), the connection from
// config (inline JSON, or "" meaning the session's @esql_tvf_config /
// @sql_tvf_config). See docs/cn/esql_sql_exttab.md.
message ForeignScan {
  // kind is "esql" or "sql".
  string kind = 1;
  // config is the connection config option, verbatim ("" means session var).
  string config = 2;
  // default_query is the 'query' table option ("" when not set).
  string default_query = 3;
  // pushdown is true when the table opted into predicate pushdown with
  // 'pushdown' = 'true' (SQL only).  The safe zero value is "no pushdown":
  // MO then sends the query text verbatim, which is correct against any
  // remote.
  bool pushdown = 4;
}

// KafkaScan describes a scan of a Kafka external table (CREATE EXTERNAL
// TABLE ... ENGINE = KAFKA): one topic partition read as csv or jsonl
// records, one record per message. Read position/limits come from
// __mo_read_start_id / __mo_read_size / __mo_read_timeout predicates,
// resolved at compile time. See docs/cn/kafka_exttab.md and issue #27518.
message KafkaScan {
  // brokers is the comma-separated bootstrap host:port list.
  string brokers = 1;
  string topic = 2;
  int32 partition = 3;
  // autocommit false requires __mo_read_start_id on every SELECT and commits
  // the read offset at that position; true reads earliest/latest and commits
  // as the scan completes.
  bool autocommit = 4;
  // group is the consumer group carrying the committed-offset bookmark.
  string group = 5;
  // format is "csv" or "jsonl"; separator is the csv field separator rune.
  string format = 6;
  string separator = 7;
  // Effective read controls, resolved from the WHERE conjuncts at compile
  // time (defaults applied there): start_id is the last-consumed offset
  // (reading begins after it; with autocommit true, 0 means earliest
  // inclusive and -1 means latest), size caps the record count (0 = no
  // cap), timeout_seconds ends the read when no new message arrives in
  // time (0 = block forever).
  int64 start_id = 8;
  bool has_start_id = 9;
  int64 size = 10;
  int64 timeout_seconds = 11;
}

message IcebergScan {
  uint64 mapping_id = 1;
  uint64 catalog_id = 2;
  string namespace = 3;
  string table = 4;
  string ref = 5;
  int64 snapshot_id = 6;
  int64 timestamp_as_of = 7;
  string read_mode = 8;
  repeated int32 projected_field_ids = 9;
  string filter_digest = 10;
}

// MongoScan is a credential-free scan description. Authentication and TLS
// material are resolved on the execution CN from connection_id/version.
message MongoScan {
  uint64 mapping_id = 1;
  uint64 connection_id = 2;
  uint64 connection_version = 3;
  string database = 4;
  string collection = 5;
  repeated MongoColumnMapping columns = 6;
  MongoPredicate pushed_predicate = 7;
  repeated string projected_paths = 8;
  string residual_filter_digest = 9;
  int32 max_parallelism = 10;
  MongoSplit split = 11;
  int64 max_scan_rows = 12;
  int64 max_scan_bytes = 13;
  // mapping_version pins the tenant-scoped mapping row that was validated at
  // compile time. The execution CN re-reads that exact catalog generation.
  uint64 mapping_version = 14;
  // table_id is the stable MO relation identity used to locate the mapping
  // during compilation. It remains distinct from the catalog mapping_id so a
  // cached logical plan can be compiled more than once without identity drift.
  uint64 table_id = 15;
  // user_query_* is the validated, credential-free BSON representation selected
  // by an explicit __mo_query predicate. kind is 1 for filter and 2 for pipeline;
  // zero keeps the ordinary Find path unchanged.
  int32 user_query_kind = 16;
  bytes user_filter_bson = 17;
  repeated bytes user_pipeline_stage_bson = 18;
  // Only the digest and validated BSON cross the plan/pipeline boundary. The
  // original query text can contain sensitive literals and must not appear in
  // protobuf diagnostics. Execution reconstructs canonical Extended JSON from
  // BSON only when __mo_query is explicitly projected.
  string user_query_digest = 19;
  // include_query_column asks MongoScan to append the synthetic __mo_query
  // value to its converted batch. It is set only when a residual or projection
  // still consumes that hidden column.
  bool include_query_column = 20;
  // empty_result records that query-level pruning rejected the only derived
  // user query. Execution validates catalog identity but opens no source cursor.
  bool empty_result = 21;
}

message MongoColumnMapping {
  string name = 1;
  string path = 2;
  Type mo_type = 3 [(gogoproto.nullable) = false];
  string conversion_mode = 4;
}

enum MongoPredicateOp {
  MONGO_PREDICATE_INVALID = 0;
  MONGO_PREDICATE_AND = 1;
  MONGO_PREDICATE_EQUAL = 2;
  MONGO_PREDICATE_NOT_EQUAL = 3;
  MONGO_PREDICATE_LESS = 4;
  MONGO_PREDICATE_LESS_EQUAL = 5;
  MONGO_PREDICATE_GREATER = 6;
  MONGO_PREDICATE_GREATER_EQUAL = 7;
  MONGO_PREDICATE_IN = 8;
  MONGO_PREDICATE_IS_NULL = 9;
  MONGO_PREDICATE_IS_NOT_NULL = 10;
}

message MongoPredicate {
  MongoPredicateOp op = 1;
  string path = 2;
  // Canonical BSON value bytes retain Mongo numeric and temporal types while
  // keeping the protobuf independent from the Go driver.
  bytes value_bson = 3;
  repeated bytes values_bson = 4;
  repeated MongoPredicate children = 5;
}

message MongoSplit {
  string key_path = 1;
  bytes lower_bson = 2;
  bytes upper_bson = 3;
  bool lower_inclusive = 4;
  bool upper_inclusive = 5;
}

message ExternAttr {
  string col_name = 1;
  int32 col_index = 2;
  int32 col_field_index = 3;
}

message LockTarget {
  uint64 table_id = 1;
  int32 primary_col_idx_in_bat = 2;
  Type primary_col_typ = 3 [(gogoproto.nullable) = false];
  int32 refresh_ts_idx_in_bat = 4;
  int32 filter_col_idx_in_bat = 5;
  bool lock_table = 6;
  bool block = 9;
  lock.LockMode Mode = 10;
  int32 primary_col_rel_pos = 11;
  int32 filter_col_rel_pos = 12;
  Expr lock_rows = 13;
  bool lock_table_at_the_end = 14;
  ObjectRef obj_ref = 15;
  int32 partition_col_idx_in_bat = 16;
  bool has_partition_col = 17;
}

message PreInsertUkCtx {
  // index of columns(parts of unique key) in pre batch
  repeated int32 columns = 1;
  int32 pk_column = 2;
  Type pk_type = 3 [(gogoproto.nullable) = false];
  Type uk_type = 4 [(gogoproto.nullable) = false];
  // INSERT IGNORE with multiple independent unique constraints cannot be
  // implemented by chaining per-key dedup operators: a row rejected by one
  // constraint must not reserve another key.  In this mode key_columns and
  // conflict_columns are parallel arrays.  conflict_columns mark conflicts
  // with rows that existed before the statement; key_columns are arbitrated
  // together, in input order, against keys accepted earlier in the statement.
  bool insert_ignore_multi_dedup = 5;
  repeated int32 key_columns = 6;
  repeated int32 conflict_columns = 7;
  int32 output_columns = 8;
}

message PreInsertCtx {
  ObjectRef ref = 1;
  TableDef table_def = 2;
  bool has_auto_col = 3;
  int32 col_offset = 4;
  Expr comp_pkey_expr = 5;
  Expr cluster_by_expr = 6;
  bool is_old_update = 7;
  bool is_new_update = 8;
  bool has_target_selector = 9;
  int32 target_row_number_col = 10;
  int32 target_active_col = 11;
  int32 target_row_id_col = 12;
}

// RuntimeFilterKeyEncoding records the versioned producer-side closure
// guaranteed by an exact runtime-filter payload.  UNSPECIFIED is the
// legacy/default state and must fail open: old plans do not carry the probe
// type needed to validate the SQL equality contract at execution.
enum RuntimeFilterKeyEncoding {
  RUNTIME_FILTER_KEY_UNSPECIFIED = 0;
  RUNTIME_FILTER_KEY_RAW_V1 = 1;
  // The payload contains both physical representations of zero whenever zero
  // is present, so raw Bloom-filter consumers cannot reject a SQL-equal signed
  // zero. A producer which cannot perform that closure must publish PASS.
  RUNTIME_FILTER_KEY_FLOAT_ZERO_CLOSED_V1 = 2;
  // SERIAL_V1 and SERIAL_FULL_V1 describe the corresponding tuple encoders.
  // Their ordered component contracts are carried in
  // key_component_probe_types. A producer must validate every component
  // before evaluating the encoder; an unrecognized or invalid contract is
  // PASS.
  RUNTIME_FILTER_KEY_SERIAL_V1 = 3;
  RUNTIME_FILTER_KEY_SERIAL_FULL_V1 = 4;
}

message RuntimeFilterSpec {
  int32 tag = 1;
  bool match_prefix = 2;
  int32 upper_limit = 3;
  Expr expr = 4;
  bool not_on_pk = 5;
  bool use_membership_filter = 6;
  RuntimeFilterKeyEncoding key_encoding = 7;
  // probe_type and build_expr.Typ form the two-sided SQL equality contract.
  // The actual build vector is checked against both at execution time.
  Type probe_type = 8;
  // Ordered SQL probe-side component types for versioned tuple encodings.
  // build_expr's ordered column arguments provide the declared build types;
  // executors additionally validate the materialized component vectors.
  repeated Type key_component_probe_types = 9 [(gogoproto.nullable) = false];
  // Producer expression for a versioned exact-key contract.
  // Below the rollout gate, metadata-independent RAW_V1 may also carry an
  // identical legacy expr so pre-contract executors retain raw-safe filters.
  // Versioned steady-state, metadata-dependent, and transforming encodings
  // leave legacy expr unset. Probe specs continue to use expr for scan-side
  // evaluation.
  Expr build_expr = 10;
  // The producer is the materialized result of an uncorrelated scalar
  // subquery. The executor may publish an exact filter only after observing
  // exactly one row; multiple rows must fail open so the SINGLE operator can
  // enforce cardinality at its original logical scope.
  bool scalar_predicate = 11;
}

message IdList {
  repeated int64 list = 1;
}

message ColPosMap {
  map<string, int32> map = 1;
}

message DeleteCtx {
  bool can_truncate = 1;
  ObjectRef ref = 2;
  int32 row_id_idx = 3;
  bool add_affected_rows = 4;
  bool is_cluster_table = 5;
  int32 primary_key_idx = 9;
  TruncateTable truncate_table = 10;
  TableDef table_def = 11;
}

message PostDmlFullTextCtx {
  string source_table_name = 1;
  string index_table_name = 2;
  repeated string parts = 3;
  string algo_params = 4;
}

message PostDmlCtx {
  ObjectRef ref = 1;
  bool add_affected_rows = 2;
  int32 primary_key_idx = 3;
  string primary_key_name = 4;
  bool is_delete = 5;
  bool is_insert = 6;
  bool is_delete_without_filters = 7;
  PostDmlFullTextCtx full_text = 8;
}

message Query {
  enum StatementType {
    UNKNOWN = 0;
    SELECT = 1;
    INSERT = 2;
    // REPLACE = 3; // removed: legacy REPLACE path eliminated
    reserved 3;
    DELETE = 4;
    UPDATE = 5;
    MERGE = 6;
  }

  StatementType stmt_type = 1;

  // A query may need to run in steps.   This in theory is not
  // necessary but often convenient and/or can be better optimized.
  // For example, executing non correctlated scalar subquery first
  // we can plug the value in the optmizer and the newly available
  // value may generate better plan.

  // Each step is simply a root node.  Root node refers to other
  // node as children and the whole step is a DAG.
  repeated int32 steps = 2;

  // All the nodes.  It is OK to have dangle nodes, we only excute nodes
  // reachable from step roots.
  repeated Node nodes = 3;

  // Bound Parameter for the query.
  repeated Expr params = 4;

  // return head
  repeated string headings = 5;

  // load Tag
  bool loadTag = 6;

  // load write S3
  bool loadWriteS3 = 7;

  // detectSqls are sqls detect fk self refer constraint
  repeated string detectSqls = 8;

  repeated Query background_queries = 9;

  // run time config that can change query behaviors
  int64 maxDop = 10;

  // True when the planner generated recursive FK side-effect DML for this query.
  bool has_foreign_key_action = 11;

  // Catalog objects that a rewrite depends on even when the final plan no
  // longer contains the scans that originally carried those objects.
  repeated ObjectRef catalog_dependencies = 12;

  // DML RETURNING is a deferred result: returning_step identifies the step
  // whose rows are buffered until the statement has reached its terminal
  // transaction outcome. It is a step-array index, not a node id.
  bool has_returning = 13;
  int32 returning_step = 14;

  // Apply the session sql_select_limit to the final result pipeline. This is
  // false when the SELECT has an explicit top-level LIMIT, which takes
  // precedence according to MySQL semantics.
  bool apply_sql_select_limit = 15;
}

message TransationControl {
  enum TclType {
    BEGIN = 0;
    COMMIT = 1;
    ROLLBACK = 2;
  }
  // TransationControl type
  TclType tcl_type = 1;
  oneof action {
    TransationBegin begin = 2;
    TransationCommit commit = 3;
    TransationRollback rollback = 4;
  }
}

message TransationBegin {
  enum TransationMode {
    NONE = 0;
    READ_ONLY = 1;
    READ_WRITE = 2;
  }
  TransationMode mode = 1;
}

enum TransationCompletionType {
  CHAIN = 0;
  NO_CHAIN = 1;
  RELEASE = 2;
}
message TransationCommit {
  TransationCompletionType completion_type = 1;
}
message TransationRollback {
  TransationCompletionType completion_type = 1;
}

message Plan {
  oneof plan {
    Query query = 1;
    TransationControl tcl = 2;
    DataDefinition ddl = 3;
    DataControl dcl = 4;
  }
  int32 try_run_times = 5;
  bool is_prepare = 6;
}

message column {
  repeated Expr column = 1;
}

message DataControl {
  enum DclType {
    SET_VARIABLES = 0;
    GRANT = 1;
    REVOKE = 2;
    DENY = 3;
    PREPARE = 4;
    EXECUTE = 5;
    DEALLOCATE = 6;
    CREATE_ACCOUNT = 7;
    ALTER_ACCOUNT = 8;
    DROP_ACCOUNT = 9;
  }
  // DataDefinition type
  DclType dcl_type = 1;
  oneof control {
    SetVariables set_variables = 2;
    Prepare prepare = 3;
    Execute execute = 4;
    Deallocate deallocate = 5;
    OtherDCL other = 6;
  }
}

message DataDefinition {
  enum DdlType {
    CREATE_DATABASE = 0;
    ALTER_DATABASE = 1;
    DROP_DATABASE = 2;
    CREATE_TABLE = 3;
    ALTER_TABLE = 4;
    DROP_TABLE = 5;
    CREATE_INDEX = 6;
    ALTER_INDEX = 7;
    DROP_INDEX = 8;
    TRUNCATE_TABLE = 9;
    CREATE_VIEW = 10;
    ALTER_VIEW = 11;
    DROP_VIEW = 12;
    SHOW_CREATEDATABASE = 13;
    SHOW_CREATETABLE = 14;
    SHOW_DATABASES = 15;
    SHOW_TABLES = 16;
    SHOW_COLUMNS = 17;
    SHOW_INDEX = 18;
    SHOW_VARIABLES = 19;
    SHOW_WARNINGS = 20;
    SHOW_ERRORS = 21;
    SHOW_STATUS = 22;
    SHOW_PROCESSLIST = 23;
    SHOW_TABLE_STATUS = 24;
    SHOW_TARGET = 25;
    SHOW_COLLATION = 26;
    LOCK_TABLES = 27;
    UNLOCK_TABLES = 28;
    CREATE_SEQUENCE = 29;
    ALTER_SEQUENCE = 30;
    DROP_SEQUENCE = 31;
    SHOW_SEQUENCES = 32;
    reserved 33; // former SHOW_CONNECTORS
    reserved "SHOW_CONNECTORS";
    SHOW_UPGRADE = 34;
    RENAME_TABLE = 35;
    CREATE_PITR = 36;
    DROP_PITR = 37;
    CREATE_TABLE_WITH_CLONE = 38;
    CREATE_CDC = 39;
    DROP_CDC = 40;
  }

  // DataDefinition type
  DdlType ddl_type = 1;

  // other show statement we will rewrite to a select statement
  // then we will get a Query
  // eg: 'show databases' will rewrite to 'select md.datname as `Database` from
  // mo_database md'
  Query query = 2;

  oneof definition {
    CreateDatabase create_database = 3;
    AlterDatabase alter_database = 4;
    DropDatabase drop_database = 5;
    CreateTable create_table = 6;
    AlterTable alter_table = 7;
    DropTable drop_table = 8;
    CreateIndex create_index = 9;
    AlterIndex alter_index = 10;
    DropIndex drop_index = 11;
    TruncateTable truncate_table = 12;
    ShowVariables show_variables = 13;
    AlterView alter_view = 14;
    LockTables lock_tables = 15;
    UnLockTables unlock_tables = 16;
    CreateSequence create_sequence = 17;
    DropSequence drop_sequence = 18;
    AlterSequence alter_sequence = 19;
    CreateView create_view = 20;
    RenameTable rename_table = 21;
    CreatePitr create_pitr = 100;
    DropPitr drop_pitr = 101;
    CreateCDC create_cdc = 102;
    DropCDC drop_cdc = 103;
    CloneTable clone_table = 104;
  }
}

message SubscriptionOption {
  string from = 1;
  string publication = 2;
}

message CreateDatabase {
  bool if_not_exists = 1;
  string database = 2;
  SubscriptionOption subscription_option = 3;
  string sql = 4;
}

message AlterDatabase {
  bool if_exists = 1;
  string database = 2;
}

message DropDatabase {
  bool if_exists = 1;
  string database = 2;
  uint64 database_id = 3;
  // drop database should delete fk records related to this database
  // from mo_foreign_keys
  string updateFkSql = 4;
  // drop database should check mo_foreign_keys to find fk records
  // that refer to this database before dropping the database
  string checkFKSql = 5;
}

message FkColName {
  // letter case: lower
  repeated string cols = 1;
}

/* ForeignKeyInfo holds the fk forward reference.

        Example: t2(b) --fk--> t1(a) but t1 defined after t2

                set foreign_key_checks=0;

                create table t2(b int, constraint c1 foreign key (b) references
   t1(a));

                create table t1(a int primary key);

        The reason we need ForeignKeyInfo instead of using ForeignKeyDef is
   that:

                ForeignKeyDef only has table id, column id that does not exist
   in handling fk forward reference. ForeignKeyDef does not have database name,
   table name and column names, ForeignKeyInfo also has the ForeignKeyDef
   internally that holds the child table fk definition.
*/
message ForeignKeyInfo {
  string db = 1; // database name of child table
  string table = 2; // child table name
  FkColName cols = 3; // fk names in child table
  FkColName colsReferred = 4; // referred names in parent table
  ForeignKeyDef def = 5; // child table fk def
}

message CreateTable {
  bool if_not_exists = 1;
  bool temporary = 2;
  string database = 3;
  bool replace = 4;
  TableDef table_def = 5;
  repeated TableDef index_tables = 6;
  // we need the db/table name of foreign key when create table. but we don't
  // need it in ForeignKeyDef
  repeated string fk_dbs = 7;
  repeated string fk_tables = 8;
  // we need column name when create table, but not in ForeignKeyDef
  repeated FkColName fk_cols = 9;
  string create_as_select_sql = 11;
  // create table may insert fk records related to this table
  // into mo_foreign_keys
  repeated string updateFkSqls = 12;
  // fks forward reference to me
  repeated ForeignKeyInfo fksReferToMe = 13;

  reserved 14;
  string RawSQL = 15;
}

message AlterTableDrop {
  enum Typ {
    COLUMN = 0;
    INDEX = 1;
    KEY = 2;
    PRIMARY_KEY = 3;
    FOREIGN_KEY = 4;
  }
  Typ typ = 1;
  string name = 2;
  string index_table_name = 3;
}

message AlterTableAddFk {
  string db_name = 1;
  string table_name = 2;
  // letter case: lower
  repeated string cols = 3;
  ForeignKeyDef fkey = 4;
}

message AlterTableAddIndex {
  string db_name = 1;
  string table_name = 2;
  string origin_table_primary_key = 3;
  CreateTable indexInfo = 4;
  bool index_table_exist = 5;
}

message AlterTableDropIndex {
  string db_name = 1;
  string table_name = 2;
  string index_name = 3;
  string index_table_name = 4;
}

message AlterTableAlterIndex {
  string db_name = 1;
  string table_name = 2;
  string index_name = 3;
  bool visible = 4;
}

message AlterTableAlterReIndex {
  string db_name = 1;
  string table_name = 2;
  string index_name = 3;
  int64 index_algo_param_list = 4;
  bool force_sync = 5;
  bool merge = 6;
}

message AlterTableAlterAutoUpdate {
  string db_name = 1;
  string table_name = 2;
  string index_name = 3;
  bool auto_update = 4;
  int64 day = 5;
  int64 hour = 6;
}

message AlterTableComment {
  string new_comment = 1;
}

message AlterTableName {
  string old_name = 1;
  string new_name = 2;
}

message AlterAddColumn {
  string name = 1;
  string pre_name = 2;
  Type type = 3 [(gogoproto.nullable) = false];
  int32 pos = 4;
}

message AlterDropColumn {
  uint32 idx = 1;
  uint32 seq = 2;
}

message RenameTable {
  repeated AlterTable alter_tables = 1;
}

message AlterVarcharLength {
  string column_name = 1;
  int32 new_length = 2;
  int32 old_length = 3;
}

message AlterReplaceDef {}

message AlterRenameColumn {
  string old_name = 1;
  string new_name = 2;
  int32 sequence_num = 3;
}

message AlterCopyOpt {
  map<string, bool> skip_unique_idx_dedup = 1;
  bool skip_pk_dedup = 2;
  string target_table_name = 3;
  map<string, bool> skip_indexes_copy = 4;
}

message AlterTable {
  enum AlgorithmType {
    DEFAULT = 0;
    COPY = 1;
    INSTANT = 2;
    INPLACE = 3;
  }
  message Action {
    oneof action {
      AlterTableDrop drop = 1;
      AlterTableAddFk add_fk = 2;
      AlterTableAddIndex add_index = 3;
      AlterTableAlterIndex alter_index = 4;
      AlterTableComment alter_comment = 5;
      AlterTableName alter_name = 6;
      AlterAddColumn add_column = 7;
      AlterDropColumn drop_column = 8;
      AlterTableAlterReIndex alter_reindex = 9;
      AlterVarcharLength alter_varchar_length = 10;
      // used in inplace mode, change the properties that TN doesn't care,
      // like the width of varchar, the nullability of the column, etc.
      // the updated def is copy_table_def
      AlterReplaceDef alter_replace_def = 11;
      AlterRenameColumn alter_rename_column = 12;
      AlterTableAlterAutoUpdate alter_auto_update = 13;
      AlterTableAutoIncrement alter_auto_increment = 14;
    }
  }
  string database = 1;
  TableDef table_def = 2;
  TableDef copy_table_def = 3;
  bool is_cluster_table = 4;
  repeated Action actions = 5;
  AlgorithmType algorithm_type = 6;
  string create_tmp_table_sql = 7;
  string insert_tmp_data_sql = 8;
  map<uint64, ColDef> change_tbl_colId_map = 9;
  // detect fk self refer constraint
  repeated string detectSqls = 10;
  // alter table may insert fk records related to this table
  // into mo_foreign_keys
  repeated string updateFkSqls = 11;
  string RawSQL = 12;
  AlterCopyOpt Options = 13;
  repeated string AffectedCols = 14;
  AlterPartitionOption alterPartition = 15;
}

message DropTable {
  bool if_exists = 1;
  string database = 2;
  string table = 3;
  repeated string index_table_names = 4;
  ClusterTable cluster_table = 5;
  uint64 table_id = 6;
  repeated uint64 foreign_tbl = 7;
  bool isView = 9;
  TableDef table_def = 10;
  // drop table may delete fk records related to this table
  // into mo_foreign_keys
  repeated string updateFkSqls = 11;
  // fk child table id that refers to me
  repeated uint64 fkChildTblsReferToMe = 12;
  // When dropping multiple tables in one statement, per-table details are stored here.
  repeated DropTable tables = 13;
}

message CreateView {
  bool if_not_exists = 1;
  string database = 2;
  bool replace = 3;
  TableDef table_def = 4;
}

message AlterView {
  bool if_exists = 1;
  string database = 2;
  TableDef table_def = 4;
}

message CreateSequence {
  bool if_not_exists = 1;
  string database = 2;
  TableDef table_def = 3;
}

message DropSequence {
  bool if_exists = 1;
  string database = 2;
  string table = 3;
  uint64 table_id = 4;
}

message AlterSequence {
  bool if_exists = 1;
  string database = 2;
  TableDef table_def = 3;
}

message CreateIndex {
  string database = 1;
  string table = 2;
  TableDef table_def = 3;
  string origin_table_primary_key = 4;
  CreateTable index = 5;
  bool table_exist = 6;
}

message AlterIndex {
  string index = 1;
}

message DropIndex {
  string database = 1;
  string table = 2;
  string index_name = 3;
}

message TruncateTable {
  string database = 1;
  string table = 2;
  repeated string index_table_names = 3;
  ClusterTable cluster_table = 5;
  uint64 table_id = 6;
  repeated uint64 foreign_tbl = 7;
  bool is_delete = 8;
}

message ClusterTable {
  bool is_cluster_table = 1; // insert into a cluster table
  repeated uint32 accountIDs = 2; // insert data into the cluster table for every account
  int32 column_index_of_accountId = 3; // the column index of the account id in the cluster table
}

message ShowVariables {
  bool global = 1;
  repeated Expr where = 2;
}

message SetVariables {
  repeated SetVariablesItem items = 1;
}

message SetVariablesItem {
  bool system = 1;
  bool global = 2;
  string name = 3;
  Expr value = 4;
  Expr reserved = 5;
}

message Prepare {
  string name = 1;
  repeated ObjectRef schemas = 2;
  Plan plan = 3;
  repeated int32 param_types = 4;
}

message Execute {
  string name = 1;
  repeated Expr args = 2;
}

message Deallocate {
  string name = 1;
}

message OtherDCL {
  repeated int32 paramTypes = 1;
}

enum TableLockType {
  TableLockNone = 0;
  TableLockRead = 1;
  TableLockReadLocal = 2;
  TableLockWrite = 3;
  TableLockLowPriorityWrite = 4;
}

message TableLockInfo {
  TableLockType lockType = 1;
  TableDef tableDef = 2;
}

message LockTables {
  repeated TableLockInfo tableLocks = 1;
}

message UnLockTables {}

message MetadataScanInfos {
  repeated MetadataScanInfo infos = 1;
}

