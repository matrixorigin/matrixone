# Single-node Elasticsearch for the esql_tvf end-to-end harness.
#
# Security is ENABLED (basic-auth via ELASTIC_PASSWORD) but HTTP TLS is
# DISABLED so the test driver can talk plain http://127.0.0.1:<port> with a
# username/password. This keeps the harness simple and deterministic; the
# published host port is chosen by Docker (0:9200) to avoid CI port clashes.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:0:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 3s
      timeout: 5s
      retries: 60
    networks: [esql-e2e]

networks:
  esql-e2e:
    driver: bridge
