# docker compose extension fields
# https://github.com/docker/compose/pull/5140
# https://stackoverflow.com/questions/45805380/meaning-of-ampersand-in-docker-compose-yml-file
x-mo-common: &mo-common
    build:
      context: ../../
      dockerfile: ./optools/images/Dockerfile
      args:
        GOPROXY: "https://proxy.golang.org,direct"
        # Typecheck: enable type checking for ToSliceNoTypeCheck and ToSliceNoTypeCheck2
        # Default: 0 (disabled), set to 1 to enable
        TYPECHECK: ${TYPECHECK:-0}
        GOBUILD_OPT: ${GOBUILD_OPT:-}
    image: matrixorigin/matrixone:latest
    volumes:
      - ../../etc/launch-tae-compose/config:/config
      - ../../test:/test
      - ../../docker-compose-log:/log
      - ../../coverage:/coverage
    restart: on-failure
    tty: true


services:
  cn-0:
    container_name: cn-0
    <<: *mo-common
    # exec makes mo-service PID 1, so docker compose down delivers SIGTERM to
    # the instrumented process and lets it flush GOCOVERDIR before shutdown.
    entrypoint: ["/bin/bash","-c","set -euo pipefail; exec /mo-service -debug-http :12345 -cfg /config/cn-0.toml > >(tee -a /log/cn-0.log) 2>&1"]
    profiles:
      - launch
      - launch-multi-cn
    depends_on:
      - tn
    ports:
      - "6002"
      - "12345:12345"
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - mo_reuse_enable_checker=true
      - GOCOVERDIR=/coverage
    networks:
      monet:
        aliases:
          - "cn0"

  cn-1:
    container_name: cn-1
    <<: *mo-common
    entrypoint: ["/bin/bash","-c","set -euo pipefail; exec /mo-service -debug-http :12345 -cfg /config/cn-1.toml > >(tee -a /log/cn-1.log) 2>&1"]
    depends_on:
      - tn
    ports:
      - "6002"
      - "22345:12345"
    profiles:
      - launch
      - launch-multi-cn
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - mo_reuse_enable_checker=true
      - GOCOVERDIR=/coverage
    networks:
      monet:
        aliases:
          - "cn1"

  proxy:
    container_name: proxy
    <<: *mo-common
    entrypoint: ["/bin/bash","-c","set -euo pipefail; exec /mo-service -debug-http :12345 -cfg /config/proxy.toml > >(tee -a /log/proxy.log) 2>&1"]
    profiles:
      - launch
      - launch-multi-cn
    depends_on:
      - logservice
      - cn-0
      - cn-1
    ports:
      - "6001:6009"
      - "32346:12345"
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - mo_reuse_enable_checker=true
      - GOCOVERDIR=/coverage
    networks:
      monet:
        aliases:
          - "proxy"

  tn:
    container_name: tn
    <<: *mo-common
    entrypoint: ["/bin/bash","-c","set -euo pipefail; exec /mo-service -debug-http :12345 -cfg /config/tn.toml > >(tee -a /log/tn.log) 2>&1"]
    profiles:
      - launch
      - launch-multi-cn
    depends_on:
      - logservice
    ports:
      - "41010"
      - "32345:12345"
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - mo_reuse_enable_checker=true
      - GOCOVERDIR=/coverage
    networks:
      monet:
        aliases:
          - "tn"

  logservice:
    container_name: logservice
    <<: *mo-common
    profiles:
      - launch
      - launch-multi-cn
    entrypoint: ["/bin/bash","-c","set -euo pipefail; exec /mo-service -debug-http :12345 -cfg /config/log.toml > >(tee -a /log/logservice.log) 2>&1"]
    depends_on:
      - createbuckets
    ports:
      - "32000"
      - "32001"
      - "32002"
      - "42345:12345"
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - mo_reuse_enable_checker=true
      - GOCOVERDIR=/coverage
    networks:
      monet:
        aliases:
          - "logservice"

  # ---------------------------------------------------------------------
  # jstfu: the datastream external table gRPC server (xtool/jstfu), needed
  # by test/distributed/cases/datastream.  The BVT cases address it as
  # 'server'='127.0.0.1','port'='4444' from whichever CN compiles the scan,
  # so one instance runs inside each CN's network namespace.  The jar is
  # built once by jstfu-build (Java 8 bytecode via the pom's release
  # profile) into a shared volume.  docker compose up -d does not return
  # until jstfu-build completes, so BVT cannot start before the jar exists.
  # ---------------------------------------------------------------------
  jstfu-build:
    container_name: jstfu-build
    image: maven:3.9-eclipse-temurin-17
    profiles:
      - launch
      - launch-multi-cn
    volumes:
      - ../../:/matrixone
      - jstfu_out:/jstfu-out
      - jstfu_m2:/root/.m2
    working_dir: /matrixone/xtool/jstfu
    entrypoint: ["/bin/bash","-c","set -euo pipefail; mvn -q -B -DskipTests package && cp target/jstfu.jar /jstfu-out/jstfu.jar && echo 'jstfu.jar built'"]
    networks:
      monet:

  jstfu-cn0:
    container_name: jstfu-cn0
    image: eclipse-temurin:8-jre
    profiles:
      - launch
      - launch-multi-cn
    network_mode: "service:cn-0"
    restart: on-failure
    depends_on:
      jstfu-build:
        condition: service_completed_successfully
      cn-0:
        condition: service_started
    volumes:
      # /jstfu-test (not /test): compose CI rewrites ':/test' mounts to the
      # host workspace path so LOAD DATA host paths resolve in-container;
      # jstfu's config paths must stay stable, so use a name the rewrite
      # cannot match.
      - ../../test:/jstfu-test
      - ../../etc/launch-tae-compose/config:/config
      - jstfu_out:/jstfu-out
    entrypoint: ["java","-jar","/jstfu-out/jstfu.jar","/config/jstfu-compose.json"]

  jstfu-cn1:
    container_name: jstfu-cn1
    image: eclipse-temurin:8-jre
    profiles:
      - launch
      - launch-multi-cn
    network_mode: "service:cn-1"
    restart: on-failure
    depends_on:
      jstfu-build:
        condition: service_completed_successfully
      cn-1:
        condition: service_started
    volumes:
      # /jstfu-test (not /test): compose CI rewrites ':/test' mounts to the
      # host workspace path so LOAD DATA host paths resolve in-container;
      # jstfu's config paths must stay stable, so use a name the rewrite
      # cannot match.
      - ../../test:/jstfu-test
      - ../../etc/launch-tae-compose/config:/config
      - jstfu_out:/jstfu-out
    entrypoint: ["java","-jar","/jstfu-out/jstfu.jar","/config/jstfu-compose.json"]

  minio:
    image: minio/minio:RELEASE.2023-11-01T18-37-25Z
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    profiles:
      - launch
      - launch-multi-cn
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9001' || exit 1
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      monet:

  # Create default buckets via environment variables in docker
  # https://github.com/minio/minio/issues/4769
  # mc client: https://github.com/minio/mc/blob/master/docs/minio-client-complete-guide.md
  # mc anonymous set: https://min.io/docs/minio/linux/reference/minio-mc/mc-anonymous-set.html
  createbuckets:
    image: minio/mc:RELEASE.2023-10-30T18-43-32Z
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - launch
      - launch-multi-cn
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio minio123;
      /usr/bin/mc mb myminio/mo-test;
      /usr/bin/mc anonymous set public myminio/mo-test;
      exit 0;
      "
    networks:
      monet:


volumes:
  minio_storage: {}
  jstfu_out: {}
  jstfu_m2: {}

# If there has subnet conflict, please change the subnet CIDR
networks:
  monet:
    driver: bridge
