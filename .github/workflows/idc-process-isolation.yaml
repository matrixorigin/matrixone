name: Shanghai IDC test-process isolation probe
on:
  push:
    branches: [weilu-runner-test]
    paths: [.github/workflows/idc-process-isolation.yaml]
permissions: {}
jobs:
  package:
    if: github.repository == 'matrixorigin/matrixone' && github.actor == 'Ariznawlll' && github.event.before == '97a155f92d8bc6b0a43de7aa3bac92728358100f' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stage pinned Debian package (no install, no checkout)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -q --proto '=https' --fail --silent --show-error --max-time 45 --output bwrap.deb 'https://deb.debian.org/debian/pool/main/b/bubblewrap/bubblewrap_0.8.0-2+deb12u1_amd64.deb'
          echo '3cc9134a3286ad01a323dcd924ba123eb634cefaeec82d774257e06308aeaadb  bwrap.deb' | sha256sum --check --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bwrap-pinned-${{ github.run_id }}
          path: ${{ runner.temp }}/bwrap.deb
          if-no-files-found: error
          retention-days: 1
  isolate:
    needs: package
    if: github.repository == 'matrixorigin/matrixone' && github.actor == 'Ariznawlll' && github.event.before == '97a155f92d8bc6b0a43de7aa3bac92728358100f' && github.run_attempt == 1
    runs-on: amd64-mo-shanghai-8c16g
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bwrap-pinned-${{ github.run_id }}
          path: ${{ runner.temp }}/idc-bwrap-input
      - name: Verify an unprivileged isolated process (no PR checkout)
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin
          for t in bwrap unshare podman; do
            if command -v "$t" >/dev/null; then echo "available $t=yes"; else echo "available $t=no"; fi
          done
          if test "$(id -u)" = 0; then echo 'probe stopped: outer runner is root'; exit 1; fi
          if unshare --user --map-root-user -- /bin/true; then echo 'unprivileged user namespace=yes'; else echo 'unprivileged user namespace=no'; fi
          [[ "$(uname -m)" == x86_64 ]]
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/idc-local-tool.XXXXXXXX")
          cd "$RUNNER_TEMP/idc-bwrap-input"
          echo '3cc9134a3286ad01a323dcd924ba123eb634cefaeec82d774257e06308aeaadb  bwrap.deb' | sha256sum --check --strict
          b="$private/bwrap"
          dpkg-deb --fsys-tarfile bwrap.deb | tar -xOf - ./usr/bin/bwrap > "$b"
          (cd "$private"; echo '85580dd52ed366ece8844e90fa75ac7c4de8802963071344e123221fb9f6f11e  bwrap' | sha256sum --check --strict)
          chmod 0500 "$b"
          test ! -u "$b" && test ! -g "$b"
          test "$(stat -c %a "$b")" = 500
          test "$(stat -c %u "$b")" = "$(id -u)"
          "$b" --version
          marker=$(mktemp /tmp/idc-isolation-marker.XXXXXXXX)
          trap 'unlink -- "$marker"' EXIT
          binds=(--ro-bind /usr /usr)
          for path in /bin /lib /lib64 /sbin; do
            if test -L "$path"; then binds+=(--symlink "$(readlink "$path")" "$path")
            elif test -d "$path"; then binds+=(--ro-bind "$path" "$path"); fi
          done
          "$b" --unshare-all --unshare-user --disable-userns --cap-drop ALL --new-session --die-with-parent \
            "${binds[@]}" --proc /proc --dev /dev --tmpfs /tmp --dir /run --dir /var --symlink /run /var/run \
            --clearenv --setenv PATH /usr/bin:/bin --chdir /tmp -- /bin/bash -eu -o pipefail -c '
              for spec in "serviceaccount_token:/var/run/secrets/kubernetes.io/serviceaccount/token" "docker_socket:/var/run/docker.sock" "containerd_socket:/run/containerd/containerd.sock" "host_canary:$1"; do
                p=${spec#*:}
                if test -e "$p" || test -L "$p"; then echo "isolated ${spec%%:*}=visible"; exit 1; fi
                echo "isolated ${spec%%:*}=not_visible"
              done
              for ns in mnt pid net; do
                case $ns in mnt) outer=$2;; pid) outer=$3;; net) outer=$4;; esac
                test "$(readlink "/proc/self/ns/$ns")" != "$outer"
              done
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              echo "readonly defensive probe PASS; no PR code executed"
            ' probe "$marker" "$(readlink /proc/self/ns/mnt)" "$(readlink /proc/self/ns/pid)" "$(readlink /proc/self/ns/net)"
