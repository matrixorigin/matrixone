name: Admit and collect one coverage group
on:
  workflow_call:
    inputs:
      group: {type: number, required: true}
      head: {type: string, required: true}
      source: {type: string, required: true}
      enable_cs_site_retry: {type: boolean, default: false}
      enable_4_2_dev: {type: boolean, required: false, default: false}
    secrets:
      TOKEN_ACTION: {required: false}
      CS_COVERAGE_CACHE_READ_TOKEN: {required: false}
permissions:
  contents: read
jobs:
  select:
    name: GROUP${{ inputs.group }}
    if: >-
      github.repository == 'matrixorigin/matrixone' && github.event_name == 'push' &&
      github.workflow_ref == 'matrixorigin/matrixone/.github/workflows/coverage-standby-pr32922.yaml@refs/heads/weilu-runner-test' &&
      github.actor == 'Ariznawlll' && github.run_attempt == 1 &&
      github.event.before == '2ab1e9e339f9c5770dfd0a8e17c00aa2406ec172'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ci
    permissions:
      contents: read
      actions: write
    outputs:
      child: ${{ steps.select.outputs.child }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/CI
        ref: 4972bd963f4cc9510266323b14446a8edcda2bfc
        path: .standby
        sparse-checkout: |
          scripts/coverage_standby.py
          scripts/coverage_pr_entry.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Load isolated provenance adapter from the exact trial commit
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/matrixone
        ref: ${{ github.sha }}
        path: .coverage-trial
        sparse-checkout: .github/standby-trial/ci495_trial.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - id: select
      name: Find a CS runner or use Shanghai standby
      timeout-minutes: 85
      env:
        PR: "33176"
        GROUP: ${{ inputs.group }}
        HEAD: ${{ inputs.head }}
        SOURCE: ${{ inputs.source }}
        COVERAGE_CS_SITE_RETRY: ${{ inputs.enable_cs_site_retry }}
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I .coverage-trial/.github/standby-trial/ci495_trial.py choose
    - name: Release exactly one worker
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: coverage-admit-${{ steps.select.outputs.child }}
        path: ${{ runner.temp }}/grant.json
        if-no-files-found: error
        retention-days: 1
    # A failed child must fail the job that dispatched it. Failed-only reruns
    # now create a new child for this group, not a new poll of the dead child.
    - id: wait
      name: Wait for selected group, including its UT result
      env:
        CHILD: ${{ steps.select.outputs.child }}
        POOL: ${{ steps.select.outputs.pool }}
        GROUP: ${{ inputs.group }}
        COVERAGE_CS_SITE: ${{ steps.select.outputs.site }}
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I .coverage-trial/.github/standby-trial/ci495_trial.py wait
    - name: Cancel the selected worker if the selector stops
      if: ${{ always() && steps.select.outputs.child != '' && steps.wait.outcome != 'success' }}
      timeout-minutes: 2
      env:
        CHILD: ${{ steps.select.outputs.child }}
        GROUP: ${{ inputs.group }}
        HEAD: ${{ inputs.head }}
        SOURCE: ${{ inputs.source }}
        PR: "33176"
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I .coverage-trial/.github/standby-trial/ci495_trial.py revoke
  collect:
    name: Collect Group ${{ inputs.group }} coverage
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
    - name: Collect selected child's skips
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: ${{ needs.select.outputs.child }}
        name: ut-coverage-skips-group-${{ inputs.group }}-${{ needs.select.outputs.child }}-1
        path: ${{ runner.temp }}/skips
    - name: Retain skips in parent's original generation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ut-coverage-skips-group-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/skips/*
        if-no-files-found: error
        retention-days: 7
    - name: Collect selected child's profile
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: ${{ needs.select.outputs.child }}
        name: ut-coverage-group-${{ inputs.group }}-generation-${{ needs.select.outputs.child }}-1
        path: ${{ runner.temp }}/profile
    - name: Retain profile in parent's original generation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ut-coverage-group-${{ inputs.group }}-generation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/profile/ut-coverage.out
        if-no-files-found: error
        retention-days: 7
