name: Coverage identity metadata contract
on:
  pull_request:
    paths:
      - '.github/workflows/coverage-identity-contract.yml'
      - '.github/workflows/coverage-standby-identity.yaml'
      - '.github/workflows/coverage-standby-worker.yaml'
      - '.github/ci/cancel-superseded.cjs'
      - '.github/ci/cancel-superseded.test.cjs'
      - '.github/ci/coverage-identity-contract.test.cjs'
      - '.github/ci/coverage-standby-pinned.contract.cjs'
      - '.github/ci/coverage-standby-pinned-fixture.py'
      - '.github/workflows/entrypoint.yaml'
permissions: {}
jobs:
  fixture:
    strategy:
      matrix:
        include:
          - {group: 0, pool: cs}
          - {group: 1, pool: idc}
          # Additional GROUP0 identities, with the same head and pool but
          # a different parent or parent attempt. These are names only.
          - {group: 0, pool: cs, parent: '1'}
          - {group: 0, pool: cs, attempt: '999999'}
    name: >-
      ${{ format('Coverage standby / {0}/{1}/{2}/{3}/{4}/{3}000000000000000000000000', matrix.parent || github.run_id, matrix.attempt || github.run_attempt, matrix.group, github.sha, matrix.pool) }}
    uses: ./.github/workflows/coverage-standby-identity.yaml
  verify:
    name: Read identity markers while active
    needs: fixture
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Verify expanded names and attempt identity while this run is still active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="Coverage standby / $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          key="${GITHUB_SHA}000000000000000000000000"
          endpoint="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          jobs="$RUNNER_TEMP/coverage-identity-jobs.json"
          for delay in 0 2 3 5 5 5; do
            sleep "$delay"
            status=$(curl --silent --show-error --output "$jobs" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" "$endpoint")
            case "$status" in
              200) ;;
              404) echo "Attempt jobs endpoint returned HTTP 404" >&2; continue ;;
              *) echo "Attempt jobs endpoint returned HTTP $status" >&2; exit 1 ;;
            esac
            if jq -e --arg prefix "$prefix" --arg sha "$GITHUB_SHA" --arg key "$key" \
                --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              [.jobs[] | select(.name | endswith(" / Run identity"))] as $m
              | ($m | length) == 4
                and all($m[]; .run_id == $run and .run_attempt == $attempt
                  and .status == "completed" and .conclusion == "skipped")
                and any(.jobs[]; .name == "Read identity markers while active"
                  and .run_id == $run and .run_attempt == $attempt
                  and .status == "in_progress" and .conclusion == null)
                and ([$m[].name] | sort) == ([
                  ($prefix+"/0/"+$sha+"/cs/"+$key+" / Run identity"),
                  ($prefix+"/1/"+$sha+"/idc/"+$key+" / Run identity"),
                  ("Coverage standby / 1/"+($attempt|tostring)+"/0/"+$sha+"/cs/"+$key+" / Run identity"),
                  ("Coverage standby / "+($run|tostring)+"/999999/0/"+$sha+"/cs/"+$key+" / Run identity")] | sort)' "$jobs"; then
              jq -c '.jobs[] | select((.name | endswith(" / Run identity")) or
                .name == "Read identity markers while active") |
                {name, id, run_id, run_attempt, status, conclusion}' "$jobs"
              exit 0
            fi
          done
          echo "Coverage identity was not verified within the retry budget (last HTTP $status)" >&2
          if [[ "$status" == 200 ]]; then
            jq -c '.jobs[] | {name, run_id, run_attempt, status, conclusion}' "$jobs"
          fi
          exit 1
  pinned-contract:
    name: Pinned dispatch, retry and cleanup contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            .github/workflows
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: d94028c93e14f8054a7cd4d1e2535bbaf59a8ec8
          path: .coverage-companion
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/workflows
      - name: Run the pinned companion suites and cross-repository contract
        env:
          COVERAGE_COMPANION_DIR: ${{ github.workspace }}/.coverage-companion
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          git -C "$COVERAGE_COMPANION_DIR" log -1 --format='Companion checked out at %H'
          (cd "$COVERAGE_COMPANION_DIR" && python3 -m unittest scripts.test_coverage_pr_entry scripts.test_coverage_standby scripts.test_coverage_cs_build_tools)
          node --test .github/ci/coverage-standby-pinned.contract.cjs
