name: Native Dependency Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-native-flags-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check system tools and native Make target contract
        run: |
          node --version
          /usr/bin/make --version
          PATH="/usr/bin:/bin:$PATH" node --test .github/ci/native-provenance-makeflags.test.cjs
