name: Native Dependency Checks

on:
  pull_request:
    paths:
      - ".github/workflows/native-dependency-check.yml"
      - ".dockerignore"
      - "Makefile"
      - "cgo/**"
      - "go.mod"
      - "go.sum"
      - "optools/images/Dockerfile"
      - "thirdparties/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-dependency-check.yml"
      - ".dockerignore"
      - "Makefile"
      - "cgo/**"
      - "go.mod"
      - "go.sum"
      - "optools/images/Dockerfile"
      - "thirdparties/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dependency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downloader:
    name: Downloader (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate portable downloader
        run: |
          sh -n thirdparties/download thirdparties/download_test
          make -C thirdparties test-download

  native-build:
    name: Native build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            onnx_library: onnxruntime.so
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            onnx_library: onnxruntime_arm64.so
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build native stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: optools/images/Dockerfile
          target: native
          platforms: ${{ matrix.platform }}
          load: true
          tags: matrixone-native-check:${{ matrix.arch }}
          cache-from: type=gha,scope=matrixone-native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=matrixone-native-${{ matrix.arch }}
      - name: Verify native outputs as non-root
        run: >-
          docker run --rm --platform "${{ matrix.platform }}"
          --user 65534:65534
          matrixone-native-check:${{ matrix.arch }}
          sh -c
          'test -r thirdparties/install/lib/${{ matrix.onnx_library }} &&
          test -r cgo/libmo.so && test -r cgo/libmo.a'

  dockerfile:
    name: Dockerfile (amd64 + arm64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Validate multi-platform Dockerfile
        run: >-
          docker buildx build --check
          --platform linux/amd64,linux/arm64
          --file optools/images/Dockerfile .
