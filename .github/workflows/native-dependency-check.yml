name: Native Dependency Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gossip-socket-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compare gossip listener address families
        run: go run .github/ci/diag32392-socket.go
