name: Race seed canary

on:
  pull_request:
    branches: [weilu-runner-test]
    paths:
      - '.github/workflows/race-seed-canary.yaml'
  workflow_dispatch:
    inputs:
      matrixone_sha:
        description: Full MatrixOne main SHA; use the same SHA for every arm
        required: true
        type: string
        default: '3ac87c30625fc082391e5384a4c94e50a2916cf6'
      image:
        description: Trusted builder repository at an immutable sha256 digest
        required: true
        type: string
        default: registry.cn-shanghai.aliyuncs.com/matrixorigin/matrixone@sha256:8137d222d3a3b29d119173639cea98931168ab7d886bf882894391f7804d5d88
      repetitions:
        description: One smoke pair or three measured pairs per cache state
        type: choice
        options: ['1', '3']
        default: '1'

permissions:
  contents: read

jobs:
  cs-ut-full-canary:
    if: >-
      github.repository == 'matrixorigin/matrixone' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.number == 32524) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test'))
    runs-on: cs-mty-large-7c14g
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 4df268ea5f21882599fdfd6f415b67f849b99675
          persist-credentials: false
      - name: Check architecture and resources
        run: |
          set -euo pipefail
          uname -sm
          test "$(uname -m)" = x86_64
          df -h .
          free -h
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - uses: matrixorigin/CI/actions/setup-env@main
        with:
          setup-java: true
          go-version-file: "${{ github.workspace }}/go.mod"
      - name: Prepare Python UDF contract tests
        if: ${{ hashFiles('pkg/udf/python/worker/requirements.txt') != '' }}
        timeout-minutes: 10
        uses: matrixorigin/CI/actions/setup-python-udf@main
      - name: Run complete x86 UT suite without upstream secrets
        run: |
          set -euo pipefail
          make config
          make ut UT_CONFIGURED=1 UT_PARALLEL=3 UT_TIMEOUT=40 UT_SHARD=all
      - name: Upload UT reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cs-ut-full-report
          path: ut-report/
          if-no-files-found: warn
          retention-days: 7
  canary:
    if: github.repository == 'matrixorigin/matrixone' && github.ref == 'refs/heads/main'
    # CI #456: update these two immutable pins together.
    uses: matrixorigin/CI/.github/workflows/race-seed-canary.yaml@c76c48c66de9e4684696a02510835a21d4a0aad9
    with:
      ci_sha: 'c76c48c66de9e4684696a02510835a21d4a0aad9'
      matrixone_sha: ${{ inputs.matrixone_sha }}
      image: ${{ inputs.image }}
      repetitions: ${{ inputs.repetitions }}
    secrets: inherit
