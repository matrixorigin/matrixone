name: Race seed canary

on:
  workflow_dispatch:
    inputs:
      cs_s3_probe:
        description: Run read-only signed S3 connectivity probes on CS runners
        type: boolean
        default: false
      object_storage_smoke:
        description: Run isolated local MinIO test instead of the coverage comparison
        type: boolean
        default: false
      local_minio_coverage:
        description: Run isolated coverage with local MinIO; real COS/OSS coverage is excluded
        type: boolean
        default: false
      coverage_contract_smoke:
        description: Run isolated Linux coverage workflow contract tests
        type: boolean
        default: false
      matrixone_sha:
        description: Full MatrixOne main SHA; use the same SHA for every arm
        required: true
        type: string
        default: '3ac87c30625fc082391e5384a4c94e50a2916cf6'
      image:
        description: Trusted builder repository at an immutable sha256 digest
        required: true
        type: string
        default: registry.cn-shanghai.aliyuncs.com/matrixorigin/matrixone@sha256:8137d222d3a3b29d119173639cea98931168ab7d886bf882894391f7804d5d88
      repetitions:
        description: One smoke pair or three measured pairs per cache state
        type: choice
        options: ['1', '3']
        default: '1'

permissions:
  contents: read

jobs:
  cs-coverage-canary:
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && !inputs.object_storage_smoke && !inputs.coverage_contract_smoke && !inputs.cs_s3_probe
    uses: matrixorigin/CI/.github/workflows/coverage-ut.yaml@b05be37d7d102fbf040ae45b72ff2c27ee48b720
    with:
      canary_pr_32523: true
      canary_local_minio: ${{ inputs.local_minio_coverage }}
      runner_label: cs-mnl2-large-7c14g
      canary_package_parallelism: 8
    secrets: inherit
  cs-minio-smoke:
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && inputs.object_storage_smoke && !inputs.coverage_contract_smoke && !inputs.cs_s3_probe
    runs-on: cs-mnl2-large-7c14g
    timeout-minutes: 90
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          if command -v gcc && command -v g++ && command -v make && command -v pkg-config && command -v python3; then
            echo 'Build tools already available; no package download needed.'
          else
            sudo apt-get -o Acquire::ForceIPv4=true update
            sudo apt-get -o Acquire::ForceIPv4=true install -y build-essential pkg-config python3 python-is-python3
          fi
      - name: Checkout pinned MatrixOne PR source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          repository: iamlinjunhong/matrixone
          ref: b0641dbf3cb1ed67f90f9e4226f0585ba451abc0
      - name: Set up Go
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          setup-java: false
          go-version-file: ${{ github.workspace }}/go.mod
      - name: Install isolated MinIO executable
        timeout-minutes: 30
        env:
          GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/minio-bin"
          git init "$RUNNER_TEMP/minio-source"
          git -C "$RUNNER_TEMP/minio-source" remote add origin https://github.com/minio/minio.git
          git -C "$RUNNER_TEMP/minio-source" fetch --depth=1 origin f19c534b9f457773dcd043d977433e1a71525c3b
          git -C "$RUNNER_TEMP/minio-source" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/minio-source" && go build -o "$RUNNER_TEMP/minio-bin/minio" .)
          echo "$RUNNER_TEMP/minio-bin" >> "$GITHUB_PATH"
      - name: Build native dependencies
        timeout-minutes: 40
        run: |
          set -euo pipefail
          make config
          make cgo
      - name: Run local MinIO object and file service tests
        timeout-minutes: 30
        env:
          GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
        run: |
          set -euo pipefail
          command -v minio
          export CGO_CFLAGS="-I${GITHUB_WORKSPACE}/cgo -I${GITHUB_WORKSPACE}/thirdparties/install/include"
          export CGO_LDFLAGS="-L${GITHUB_WORKSPACE}/cgo -lmo -Wl,-rpath,${GITHUB_WORKSPACE}/cgo -L${GITHUB_WORKSPACE}/thirdparties/install/lib -lusearch_c -Wl,-rpath,${GITHUB_WORKSPACE}/thirdparties/install/lib -lm"
          go test -mod=readonly -short -tags matrixone_test ./pkg/fileservice -run '^TestMinioSDK$' -v -count=1 -timeout=20m
  coverage-contract-smoke:
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && inputs.coverage_contract_smoke && !inputs.cs_s3_probe
    runs-on: cs-mnl2-large-7c14g
    timeout-minutes: 10
    steps:
      - name: Install C compiler for Linux contract test
        run: |
          set -euo pipefail
          if ! command -v cc; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi
      - name: Checkout pinned CI workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: b05be37d7d102fbf040ae45b72ff2c27ee48b720
          token: ${{ secrets.TOKEN_ACTION }}
      - name: Run Linux coverage contract tests
        run: python3 -m unittest scripts.test_coverage_native_runtime scripts.test_run_coverage_ut
  cs-s3-readonly-probe:
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && inputs.cs_s3_probe
    environment: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: MTY
            runner: cs-mty-large-7c14g
          - stack: MNL2
            runner: cs-mnl2-large-7c14g
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Signed read-only S3 list-buckets probe
        env:
          S3_PROBE_CONFIG: ${{ secrets[format('CS_S3_PROBE_{0}', matrix.stack)] }}
          S3_PROBE_STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, hmac, os, sys, time, urllib.error, urllib.parse, urllib.request
          try:
              endpoint, access, secret = os.environ['S3_PROBE_CONFIG'].split('|', 2)
              parsed = urllib.parse.urlsplit(endpoint.strip())
              if parsed.scheme != 'https' or not parsed.netloc or parsed.path not in ('', '/'):
                  raise ValueError('invalid S3 endpoint shape')
              now = datetime.datetime.now(datetime.timezone.utc)
              stamp, date = now.strftime('%Y%m%dT%H%M%SZ'), now.strftime('%Y%m%d')
              region, service = 'us-east-1', 's3'
              body_hash = hashlib.sha256(b'').hexdigest()
              signed = 'host;x-amz-content-sha256;x-amz-date'
              headers = f'host:{parsed.netloc}\nx-amz-content-sha256:{body_hash}\nx-amz-date:{stamp}\n'
              request = f'GET\n/\n\n{headers}\n{signed}\n{body_hash}'
              scope = f'{date}/{region}/{service}/aws4_request'
              message = f'AWS4-HMAC-SHA256\n{stamp}\n{scope}\n{hashlib.sha256(request.encode()).hexdigest()}'
              def sign(key, msg): return hmac.new(key, msg.encode(), hashlib.sha256).digest()
              key = sign(sign(sign(sign(('AWS4' + secret).encode(), date), region), service), 'aws4_request')
              signature = hmac.new(key, message.encode(), hashlib.sha256).hexdigest()
              auth = f'AWS4-HMAC-SHA256 Credential={access}/{scope}, SignedHeaders={signed}, Signature={signature}'
              req = urllib.request.Request(endpoint.rstrip('/') + '/', headers={'Authorization': auth, 'x-amz-date': stamp, 'x-amz-content-sha256': body_hash})
              start = time.monotonic()
              with urllib.request.urlopen(req, timeout=20) as response:
                  status = response.status
                  response.read(1)
              print(f"{os.environ['S3_PROBE_STACK']}: signed S3 ListBuckets HTTP {status}, {time.monotonic()-start:.2f}s; no writes")
          except urllib.error.HTTPError as error:
              print(f"{os.environ.get('S3_PROBE_STACK')}: signed S3 request failed: HTTP {error.code}")
              sys.exit(1)
          except Exception as error:
              print(f"{os.environ.get('S3_PROBE_STACK')}: signed S3 probe failed: {type(error).__name__}")
              sys.exit(1)
          PY
  canary:
    if: github.repository == 'matrixorigin/matrixone' && github.ref == 'refs/heads/main'
    # CI #456: update these two immutable pins together.
    uses: matrixorigin/CI/.github/workflows/race-seed-canary.yaml@c76c48c66de9e4684696a02510835a21d4a0aad9
    with:
      ci_sha: 'c76c48c66de9e4684696a02510835a21d4a0aad9'
      matrixone_sha: ${{ inputs.matrixone_sha }}
      image: ${{ inputs.image }}
      repetitions: ${{ inputs.repetitions }}
    secrets: inherit
