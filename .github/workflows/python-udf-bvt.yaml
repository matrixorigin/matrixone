name: MatrixOne Python UDF BVT

on:
  workflow_call:
    inputs:
      head_repository:
        description: "Repository containing the PR head"
        required: true
        type: string
      head_sha:
        description: "Exact PR head commit"
        required: true
        type: string
      build_artifact:
        description: "Optional shared MatrixOne build artifact"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bvt:
    name: Python UDF SQL cases
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout MatrixOne head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 3
          repository: ${{ inputs.head_repository }}
          ref: ${{ inputs.head_sha }}

      - name: Set up Go and Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/go.mod"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the locked worker dependency
        run: >-
          python3 -m pip install --no-cache-dir --only-binary=:all:
          -r pkg/udf/python/worker/requirements.txt

      - name: Download shared MatrixOne build
        if: ${{ inputs.build_artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_artifact }}
          path: ${{ runner.temp }}/mo-prebuilt

      - name: Restore the shared runtime or build locally
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/mo-prebuilt/mo-build.tar.gz"
          if [ -s "${artifact}" ]; then
            unpacked="${RUNNER_TEMP}/mo-prebuilt/unpacked"
            rm -rf "${unpacked}"
            mkdir -p "${unpacked}"
            if tar -xzf "${artifact}" -C "${unpacked}"; then
              artifact_head_sha=$(sed -n 's/^head_sha=//p' "${unpacked}/BUILD_INFO" 2>/dev/null || true)
              artifact_build_opt=$(sed -n 's/^gobuild_opt=//p' "${unpacked}/BUILD_INFO" 2>/dev/null || true)
              if [ "${artifact_head_sha}" = "${EXPECTED_HEAD_SHA}" ] \
                && [ "${artifact_build_opt}" = "-cover" ] \
                && [ -x "${unpacked}/mo-service" ] \
                && [ -d "${unpacked}/lib" ] \
                && [ -d "${unpacked}/dict" ]; then
                cp -a "${unpacked}/BUILD_INFO" "${unpacked}/mo-service" "${unpacked}/lib" "${unpacked}/dict" "${GITHUB_WORKSPACE}/"
                chmod +x mo-service
              else
                echo "::warning::shared build artifact is incomplete or mismatched; falling back to a local build"
              fi
            else
              echo "::warning::shared build artifact could not be extracted; falling back to a local build"
            fi
          fi
          if [ ! -x mo-service ]; then
            make build
          fi
          mkdir -p "${RUNNER_TEMP}/gocoverdir"

      - name: Checkout mo-tester
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: matrixorigin/mo-tester
          ref: main
          path: mo-tester
          persist-credentials: false

      - name: Run Python UDF BVT cases
        env:
          GOCOVERDIR: ${{ runner.temp }}/gocoverdir
        run: |
          set -euo pipefail
          ./optools/run_python_udf_bvt.sh "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/mo-tester"

      - name: Upload Python UDF BVT diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-udf-bvt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            mo-service.log
            python-udf-worker-*.log
            mo-tester/report
