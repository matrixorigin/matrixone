name: Object Storage Integration

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, 4.2-dev, '[0-9]+.[0-9]+*']
    paths:
      - '.github/workflows/object-storage-integration.yml'
      - 'pkg/fileservice/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'cgo/**'
      - 'thirdparties/**'
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

concurrency:
  group: >-
    object-storage-integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-
    ${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  object-storage-integration:
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        github.event.pull_request.draft == false &&
        (
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
          contains(github.event.pull_request.labels.*.name, 'safe-to-test')
        )
      )
    uses: matrixorigin/CI/.github/workflows/object-storage-integration.yaml@main
    with:
      checkout_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      TEST_S3FS_ALIYUN: ${{ secrets.TEST_S3FS_ALIYUN }}
      TEST_S3FS_QCLOUD: ${{ secrets.TEST_S3FS_QCLOUD }}
