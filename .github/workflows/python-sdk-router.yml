name: Python SDK PR routing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # 4.2-dev has an older SDK and its own offline tests; main's contract
  # runner and package extras do not exist in that branch.
  legacy-42:
    if: ${{ github.base_ref == '4.2-dev' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            sqlalchemy: '==1.4.54'
          - python: '3.10'
            sqlalchemy: '==2.0.43'
          - python: '3.12'
            sqlalchemy: '>=2.1,<3'
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check installed core without optional analytics dependencies
        if: ${{ matrix.python == '3.8' }}
        env:
          SQLALCHEMY_RANGE: ${{ matrix.sqlalchemy }}
        run: |
          python -m venv "$RUNNER_TEMP/sdk-core"
          "$RUNNER_TEMP/sdk-core/bin/python" -m pip install . "SQLAlchemy[asyncio]${SQLALCHEMY_RANGE}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-core/bin/python" -c "import importlib.util; from matrixone import Client, AsyncClient; assert importlib.util.find_spec('pyarrow') is None"
      - name: Install 4.2 SDK and offline test dependencies
        env:
          SQLALCHEMY_RANGE: ${{ matrix.sqlalchemy }}
        run: python -m pip install -e '.[test]' "SQLAlchemy[asyncio]${SQLALCHEMY_RANGE}" pytest-subtests
      - name: Run 4.2 offline suite
        run: python -m pytest tests/offline -o addopts='' -q --tb=short

  current:
    if: ${{ github.base_ref != '4.2-dev' }}
    uses: ./.github/workflows/python-sdk.yml
