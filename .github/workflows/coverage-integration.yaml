name: MatrixOne Coverage Integration

on:
  pull_request:
    branches:
      - main

jobs:
  matrixone-ci:
    uses: matrixorigin/CI/.github/workflows/ci.yaml@xp/ci-race-coverage-artifacts
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  matrixone-compose-ci:
    uses: matrixorigin/CI/.github/workflows/e2e-compose.yaml@xp/ci-race-coverage-artifacts
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  matrixone-standalone-ci:
    uses: matrixorigin/CI/.github/workflows/e2e-standalone.yaml@xp/ci-race-coverage-artifacts
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  matrixone-utils-ci:
    needs: [matrixone-ci, matrixone-compose-ci, matrixone-standalone-ci]
    if: ${{ always() }}
    uses: matrixorigin/CI/.github/workflows/utils.yaml@xp/ci-race-coverage-artifacts
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
