name: CI scope contract

on:
  pull_request:
    paths:
      - '.github/ci/**'
      - '.github/mergify.yml'
      - 'Makefile'
      - 'go.mod'
      - '.github/workflows/entrypoint.yaml'
      - '.github/workflows/python-sdk.yml'
      - '.github/workflows/iceberg-connector.yml'
      - '.github/workflows/ci-scope-check.yml'
      - '.github/workflows/ci-cancellation.yml'
      - '.github/workflows/merge-trigger-standalone.yaml'
      - '.github/workflows/merge-trigger-tke.yaml'
      - '.github/workflows/native-dependency-check.yml'
      - '.github/workflows/sca-go-module-cache.yaml'
      - '.github/workflows/jstfu-maven-cache.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: node --test .github/ci/*.test.cjs
