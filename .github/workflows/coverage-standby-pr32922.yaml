name: PR 33176 / merged CI 495 Coverage UT (isolated)
on:
  push:
    branches: [weilu-runner-test]
    paths: [.github/workflows/coverage-standby-pr32922.yaml]
permissions:
  contents: read
jobs:
  authorize:
    if: github.repository == 'matrixorigin/matrixone' && github.actor == 'Ariznawlll' && github.run_attempt == 1 && github.event.before == '944c23873fae6290cefc9a0c32159a1aa77ebb7b' && github.ref == 'refs/heads/weilu-runner-test'
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      actions: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
      source: ${{ steps.auth.outputs.head_repository }}
      sha: ${{ steps.auth.outputs.head_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: 4972bd963f4cc9510266323b14446a8edcda2bfc
          path: fixed-ci
          sparse-checkout: |
            scripts/coverage_cache_preflight.py
            scripts/coverage_pr_entry.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: 7a8cf1854da5ca4cc5ffb5a1f2cbc454162ad589
          path: reviewed
          sparse-checkout: |
            scripts
            config
          persist-credentials: false
      - name: Verify the frozen PR head, official preflight, and production eligibility
        id: auth
        env:
          CS_PR_METADATA_TOKEN: ${{ secrets.TOKEN_ACTION }}
          CS_CACHE_READ_TOKEN: ${{ secrets.CS_COVERAGE_CACHE_READ_TOKEN || github.token }}
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/fixed-ci/scripts:$GITHUB_WORKSPACE/reviewed/scripts" python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from coverage_pr_entry import ENTRY, PROJECT, has_s3_fixture, route
          import node_cache_real_pr_gate as approved

          number, run_id, preflight = 33176, 45952769594, 140352208426
          head, source, author = "1e244603917809ad7e13d2bb4aafdbd0fd52e06e", "Ariznawlll/matrixone", "Ariznawlll"
          def check(ok, message):
              if not ok:
                  raise SystemExit(message)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          def actions_record(path):
              check(path in (f"actions/runs/{run_id}", f"actions/jobs/{preflight}"),
                    "Unapproved Actions provenance path")
              request = urllib.request.Request(f"https://api.github.com/repos/{PROJECT}/{path}",
                  headers={"Authorization": "Bearer " + os.environ["API_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                  raw = response.read(2 * 1024**2 + 1)
                  check(response.status == 200 and len(raw) <= 2 * 1024**2,
                        "Actions provenance record unavailable")
                  return json.loads(raw)
          code, p = approved.read(f"repos/{PROJECT}/pulls/{number}", token=os.environ["CS_PR_METADATA_TOKEN"])
          check(code == 200, "Required PR record unavailable")
          r = actions_record(f"actions/runs/{run_id}")
          j = actions_record(f"actions/jobs/{preflight}")
          check(p["user"]["login"] == author and p["base"]["ref"] == "main"
                and p["head"]["repo"]["full_name"] == source and p["head"]["sha"] == head
                and p["state"] == "open" and not p["draft"],
                "PR no longer matches the authorized trial subject")
          check(r["repository"]["full_name"] == PROJECT and r["event"] == "pull_request_target"
                and r["path"] == ".github/workflows/entrypoint.yaml" and r["head_sha"] == head
                and r["head_repository"]["full_name"] == source and r["head_branch"] == p["head"]["ref"]
                and r["run_attempt"] == 1, "official PR run does not match the subject")
          check((j["run_id"], j["run_attempt"], j["head_sha"], j["name"], j["conclusion"])
                == (run_id, 1, head, "CI preflight", "success"), "official PR preflight did not pass")
          member, checks = approved.membership(author, os.environ["CS_CACHE_READ_TOKEN"], os.environ["CS_PR_METADATA_TOKEN"])
          result = route((PROJECT, "pull_request_target", ENTRY),
                         {"number": number, "action": "opened", "pull_request": p}, p, member,
                         lambda src, rev: has_s3_fixture(src, rev, os.environ["CS_PR_METADATA_TOKEN"]))
          check(result == {"route": "cache", "allowed": "true", "head_sha": head, "head_repository": source},
                "Merged CI 495 did not authorize the exact PR and fixtures")
          receipt = dict(schema=2, allowed="true", pr_number=str(number), author=author, base_ref="main",
                         head_sha=head, head_repository=source, verified_membership_http_status=member,
                         membership_checks=checks, project_cache_namespace=PROJECT)
          approved.c.atomic_json(Path(os.environ["RUNNER_TEMP"]) / "real-pr-authorization.json", receipt)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, value in result.items():
                  print(f"{key}={value}", file=out)
          print(f"Official preflight verified; authorized MatrixOne PR #33176 at {head}")
          PY
      - name: Check Coverage S3 configuration names
        env:
          CS_S3_MTY_CONFIG: ${{ secrets.CS_S3_MTY_CONFIG }}
          CS_S3_MNL2_CONFIG: ${{ secrets.CS_S3_MNL2_CONFIG }}
          CS_S3_JED_CONFIG: ${{ secrets.CS_S3_JED_CONFIG }}
          CS_S3_RUH_CONFIG: ${{ secrets.CS_S3_RUH_CONFIG }}
        run: |
          set -euo pipefail
          for name in CS_S3_MTY_CONFIG CS_S3_MNL2_CONFIG CS_S3_JED_CONFIG CS_S3_RUH_CONFIG; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing Coverage S3 configuration: $name" >&2
              exit 1
            fi
          done
      - name: Check durable cache grants with the production read credential
        env:
          CS_CACHE_READ_TOKEN: ${{ secrets.CS_COVERAGE_CACHE_READ_TOKEN || github.token }}
        run: PYTHONPATH="$GITHUB_WORKSPACE/reviewed/scripts" python3 fixed-ci/scripts/coverage_cache_preflight.py reviewed/config
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-pr-snapshot-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-pr-authorization.json
          if-no-files-found: error
  coverage:
    name: Route Coverage group ${{ matrix.group }}
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1]
    permissions:
      contents: read
      actions: write
      pull-requests: read
    uses: ./.github/workflows/standby-trial-route.yaml
    secrets:
      TOKEN_ACTION: ${{ secrets.TOKEN_ACTION }}
    with:
      group: ${{ matrix.group }}
      head: ${{ needs.authorize.outputs.sha }}
      source: ${{ needs.authorize.outputs.source }}
  merge:
    needs: [authorize, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      percent: ${{ steps.total.outputs.percent }}
      artifact: ${{ steps.profile.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: c48984d3f9a6aff6179b28aa3e3d5466141a56b7
          sparse-checkout: |
            scripts/coverage_group_collect.py
            scripts/coverage_two_groups_merge.py
            scripts/compact_coverage_profile.go
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ut-coverage-skips-group-*-${{ github.run_id }}-*
          path: raw/groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ut-coverage-group-*-generation-${{ github.run_id }}-*
          path: raw/profiles
      - name: Verify and merge both groups
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.sha }}
          GROUP_COUNT: '2'
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD_SHA"
          python3 scripts/coverage_group_collect.py --groups raw/groups --profiles raw/profiles --output selected --run-id "$GITHUB_RUN_ID" --group-count "$GROUP_COUNT"
          python3 scripts/coverage_two_groups_merge.py selected/groups combined-skip-manifest.json --expected-sha "$EXPECTED_HEAD_SHA" --group-count "$GROUP_COUNT"
          for ((group=0;group<GROUP_COUNT;group++)); do
            test "$(head -n 1 "selected/profiles/$group/ut-coverage.out")" = 'mode: set'
            if [ "$group" = 0 ]; then
              cat "selected/profiles/$group/ut-coverage.out" > "$RUNNER_TEMP/ut-coverage.out"
            else
              tail -n +2 "selected/profiles/$group/ut-coverage.out" >> "$RUNNER_TEMP/ut-coverage.out"
            fi
          done
          go run scripts/compact_coverage_profile.go "$RUNNER_TEMP/ut-coverage.out"
      - id: total
        name: Compute covered statement percentage from the compacted set profile
        run: |
          python3 - <<'PY'
          import os, pathlib
          total = covered = 0
          with (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ut-coverage.out").open() as f:
              assert next(f).strip() == "mode: set"
              for line in f:
                  _, n, hit = line.rsplit(None, 2)
                  count, flag = int(n), int(hit)
                  assert count >= 0 and flag in (0, 1)
                  total += count
                  covered += flag * count
          assert total > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"percent={covered*100/total:.2f}", file=f)
          PY
      - id: profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ut-coverage-generation-${{ github.run_id }}-${{ github.run_attempt }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ut-coverage.out
          if-no-files-found: error
      - name: Upload combined group evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ut-coverage-combined-skips-${{ github.run_id }}-${{ github.run_attempt }}
          path: combined-skip-manifest.json
          if-no-files-found: error
  feedback:
    name: Report Coverage UT to the exact PR head
    needs: [authorize, coverage, merge]
    if: needs.coverage.result == 'success' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Publish the isolated two-group result, not the full CI status
        env:
          API_TOKEN: ${{ github.token }}
          COVERAGE_HEAD: ${{ needs.authorize.outputs.sha }}
          COVERAGE_PERCENT: ${{ needs.merge.outputs.percent }}
          COVERAGE_ARTIFACT: ${{ needs.merge.outputs.artifact }}
        run: |
          set -euo pipefail
          test "$COVERAGE_HEAD" = '1e244603917809ad7e13d2bb4aafdbd0fd52e06e'
          [[ "$COVERAGE_PERCENT" =~ ^([0-9]{1,2}\.[0-9]{2}|100\.00)$ ]]
          [[ "$COVERAGE_ARTIFACT" =~ ^https://github\.com/matrixorigin/matrixone/actions/runs/${GITHUB_RUN_ID}/artifacts/[0-9]+$ ]]
          root="$GITHUB_API_URL/repos/matrixorigin/matrixone"
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $API_TOKEN" \
            "$root/pulls/33176" | jq -e --arg head "$COVERAGE_HEAD" \
            '.state == "open" and .head.sha == $head and .head.repo.full_name == "Ariznawlll/matrixone"' >/dev/null
          payload=$(jq -n --arg url "$COVERAGE_ARTIFACT" --arg description "Both groups passed; UT coverage ${COVERAGE_PERCENT}%" \
            '{state:"success", context:"Coverage UT (CI #495 trial)", target_url:$url, description:$description}')
          curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" --data "$payload" "$root/statuses/$COVERAGE_HEAD" |
            jq -e --arg url "$COVERAGE_ARTIFACT" 'select(.state == "success" and .target_url == $url) | .context'
          printf 'Coverage UT: %s%% on `%s`; [combined profile](%s).\n' \
            "$COVERAGE_PERCENT" "$COVERAGE_HEAD" "$COVERAGE_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
