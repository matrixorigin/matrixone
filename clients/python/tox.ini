[tox]
envlist = sqlalchemy14,sqlalchemy20,sqlalchemy21

[testenv]
extras = core-test
deps =
    sqlalchemy14: SQLAlchemy[asyncio]>=1.4,<1.5
    sqlalchemy20: SQLAlchemy[asyncio]>=2.0,<2.1
    sqlalchemy21: SQLAlchemy[asyncio]>=2.1,<3
commands = python scripts/run_contracts.py --output {envtmpdir}/contracts

[testenv:online]
extras = core-test
passenv = MO_*
commands = python scripts/run_contracts.py {posargs:--server 4.2.5}

[testenv:lint]
deps = black>=22.0
       flake8>=4.0
commands =
    python -m black matrixone --check
    python -m flake8 matrixone --select=E9,F63,F7,F82 --show-source
